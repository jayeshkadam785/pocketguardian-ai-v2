<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PocketGuardian AI Pro</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#c0154a">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root { --bg: #0a0a0f; --panel: #16161f; --red: #ff3b5c; --green: #34c759; --blue: #3b82f6; --orange: #f59e0b; --purple: #a855f7; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: #f1f1f1; font-family: 'Segoe UI', sans-serif; min-height: 100vh; overflow-x: hidden; }
  
  /* Layout */
  .dashboard-container { display: grid; grid-template-columns: 200px 1fr; min-height: 100vh; }
  .sidebar { background: #000; padding: 20px; border-right: 1px solid #222; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .main-grid { padding: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 15px; }

  /* UI Elements */
  .col { background: var(--panel); border-radius: 12px; padding: 15px; border: 1px solid #222; display: flex; flex-direction: column; }
  .col h3 { font-size: 13px; margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 8px; text-transform: uppercase; }
  .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; margin-bottom: 10px; font-size: 12px; transition: 0.3s; }
  .sos-btn { width: 140px; height: 140px; border-radius: 50%; background: radial-gradient(circle, #ff3b5c, #b8002e); border: none; color: white; font-size: 32px; font-weight: bold; box-shadow: 0 0 30px rgba(255,59,92,0.6); cursor: pointer; display: flex; align-items: center; justify-content: center; }
  
  /* Inputs */
  input { width: 100%; padding: 12px; background: #000; border: 1px solid #333; border-radius: 8px; color: white; margin-bottom: 10px; font-size: 13px; }
  
  /* Overlays */
  .overlay-screen { display: none; position: fixed; top:0; left:0; width:100%; height:100%; z-index: 99999; flex-direction: column; align-items: center; justify-content: center; }
  #authScreen { background: var(--bg); display: flex; }
  #fakeCallScreen { background: linear-gradient(180deg, #1a2a3a, #0a0a0f 60%); }
  #checkinBanner { display: none; position: fixed; top: 0; left: 0; width: 100%; background: #b8002e; color: white; padding: 15px; text-align: center; z-index: 100000; border-bottom: 2px solid white; }

  #routeMap { height: 220px; width: 100%; border-radius: 8px; margin-top: 10px; display: none; }
  .incident-log { background: #000; padding: 10px; border-radius: 8px; margin-bottom: 8px; border-left: 3px solid var(--red); font-size: 11px; }
  
  @media (max-width: 800px) { .dashboard-container { grid-template-columns: 1fr; } .sidebar { flex-direction: row; justify-content: space-between; } }
</style>
</head>
<body>

<div id="checkinBanner">
  <div id="checkinText">Safety Check: Are you okay? SOS triggers in <span id="checkinCountdown">30</span>s</div>
  <button style="margin-top:10px; padding:8px 20px; background:var(--green); border:none; border-radius:5px; color:white; font-weight:bold; cursor:pointer;" onclick="confirmSafeCheckin()">✅ I'm Fine</button>
</div>

<div class="dashboard-container">
  <!-- SIDEBAR -->
  <div class="sidebar">
    <h2 style="color:var(--red); font-size:18px; margin-bottom:20px;">PG AI</h2>
    <button class="sos-btn" id="sosBtn" onclick="startSOSCountdown()">SOS</button>
    <div id="status" style="margin-top:15px; font-size:12px; color:var(--green);">Ready</div>
    
    <select id="langSelector" onchange="setLanguage(this.value)" style="margin-top:auto; width:100%; padding:8px; background:#111; color:white; border:1px solid #333;">
      <option value="en">English</option><option value="hi">हिंदी</option><option value="mr">मराठी</option>
      <option value="gu">ગુજરાતી</option><option value="ur">اردو</option><option value="bn">বাংলা</option>
      <option value="ta">தமிழ்</option><option value="te">తెలుగు</option><option value="kn">ಕನ್ನಡ</option>
    </select>
    <button onclick="handleLogout()" style="background:none; border:none; color:#666; font-size:12px; margin-top:15px;">Logout</button>
  </div>

  <!-- DASHBOARD GRID -->
  <div class="main-grid" id="mainDashboard" style="display:none;">
    
    <!-- COL 1: Routing -->
    <div class="col">
      <h3 id="txt-nav-h" style="color:var(--green);">Road Navigation</h3>
      <button class="btn" style="background:var(--green);" onclick="findSafeRoute('police')">👮 Find Police Station</button>
      <button class="btn" style="background:#0891b2;" onclick="findSafeRoute('hospital')">🏥 Find Hospital</button>
      <div id="routeMap"></div>
      <div id="routeInfo" style="font-size:11px; margin-top:10px; text-align:center;"></div>
    </div>

    <!-- COL 2: AI Sensors -->
    <div class="col">
      <h3 id="txt-ai-h" style="color:var(--purple);">AI & Wearable</h3>
      <button class="btn" style="background:#059669;" onclick="connectBT()">⌚ Pair Wearable</button>
      <button class="btn" style="background:var(--red);" id="aiBtn" onclick="toggleThreat()">AI Threat Detection: OFF</button>
      <button class="btn" style="background:#ec4899;" id="voiceBtn" onclick="toggleVoice()">Voice SOS (Trigger: HELP): OFF</button>
      <div id="crowdLevel" style="font-size:11px; text-align:center; margin-top:10px;">Crowd: Normal</div>
    </div>

    <!-- COL 3: Journey -->
    <div class="col">
      <h3 id="txt-journey-h" style="color:var(--blue);">Journey & Evidence</h3>
      <button class="btn" style="background:#0ea5e9;" id="jBtn" onclick="toggleJourney()">Journey Monitoring: OFF</button>
      <button class="btn" style="background:var(--orange);" onclick="toggleRecording()" id="recBtn">Record Video Evidence</button>
      <button class="btn" style="background:var(--blue);" onclick="genQR()">Live Track Link & QR</button>
      <div id="qrBox" style="display:none; background:white; padding:5px; margin-top:10px; text-align:center;"><div id="qrCanvas" style="display:inline-block;"></div></div>
      <video id="vidPrev" autoplay muted playsinline style="display:none; width:100%; border-radius:8px; margin-top:10px; background:#000;"></video>
    </div>

    <!-- COL 4: ICCC Logs -->
    <div class="col">
      <h3 id="txt-dash-h" style="color:var(--orange);">ICCC Incident Board</h3>
      <button class="btn" style="background:#333;" onclick="loadLogs()">Refresh Dashboard</button>
      <div id="logContainer" style="overflow-y:auto; max-height:400px;"></div>
    </div>

    <!-- COL 5: Contacts -->
    <div class="col">
      <h3 id="txt-contacts-h" style="color:var(--red);">Personal Contacts</h3>
      <input type="text" id="cn" placeholder="Name">
      <input type="tel" id="cp" placeholder="91XXXXXXXXXX">
      <button class="btn" style="background:var(--red);" onclick="saveC()">+ Add Contact</button>
      <div id="cList" style="margin-top:10px;"></div>
    </div>

  </div>
</div>

<!-- AUTH SCREENS -->
<div id="authScreen" class="overlay-screen">
  <div class="col" style="width:100%; max-width:350px;">
    <h1 style="color:var(--red); text-align:center; margin-bottom:20px;">PocketGuardian AI</h1>
    <input type="email" id="authEmail" placeholder="Email">
    <input type="password" id="authPassword" placeholder="Password">
    <button class="btn" style="background:var(--red);" onclick="handleAuthSubmit()" id="loginBtn">Login / Sign Up</button>
    <a href="#" onclick="forgotPass()" style="color:#999; font-size:12px; text-align:center; text-decoration:none;">Forgot Password?</a>
    <div id="authError" style="color:var(--red); font-size:12px; margin-top:10px; text-align:center;"></div>
  </div>
</div>

<!-- FAKE CALL SCREEN -->
<div id="fakeCallScreen" class="overlay-screen">
  <div style="text-align:center; margin-top:40px;">
    <div style="width:110px; height:110px; border-radius:50%; background:#2a2a3a; margin: 0 auto; display:flex; align-items:center; justify-content:center; font-size:50px;">👤</div>
    <h2 style="margin-top:20px; font-size:35px;">Mom</h2>
    <p id="callStatus" style="color:#999;">Incoming call...</p>
  </div>
  <div style="display:flex; justify-content:space-around; width:100%; max-width:320px;">
    <button class="sos-btn" style="width:70px; height:70px; background:#ff3b30; transform:rotate(135deg);" onclick="endCall()">📞</button>
    <button class="sos-btn" style="width:70px; height:70px; background:var(--green);" onclick="ansCall()">📞</button>
  </div>
</div>

<script>
// --- CORE CONFIG ---
const SUPABASE_URL = "https://xccnzedcdeecfmhxiwxs.supabase.co";
const SUPABASE_KEY = "sb_publishable_Rj_HX1xUGpa-tzhsIPWeqw_6IZx0fEy";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;
let mapObj = null;
let currentLang = "en";

// Offline Data Backup
const BACKUP_POLICE = [
  { name: "Satara City Police", lat: 17.6894, lng: 73.9918, phone: "02162230580" },
  { name: "Pune Shivajinagar Police", lat: 18.5314, lng: 73.8444, phone: "02025536263" }
];

// --- AUTH LOGIC ---
async function handleAuthSubmit() {
  const email = document.getElementById("authEmail").value;
  const password = document.getElementById("authPassword").value;
  const err = document.getElementById("authError");
  try {
    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if (error) {
      const { error: signUpErr } = await supabaseClient.auth.signUp({ email, password });
      if (signUpErr) throw signUpErr;
      err.style.color = "var(--green)"; err.textContent = "Sign up successful! Verify your email.";
    } else { loginSuccess(data.user); }
  } catch (e) { err.textContent = e.message; }
}

async function forgotPass() {
  const email = document.getElementById("authEmail").value;
  if(!email) return alert("Enter email first!");
  await supabaseClient.auth.resetPasswordForEmail(email);
  alert("Password reset link sent!");
}

function loginSuccess(user) {
  currentUser = user;
  document.getElementById("authScreen").style.display = "none";
  document.getElementById("mainDashboard").style.display = "grid";
  loadC(); loadLogs(); updateCrowd();
}

// --- SOS LOGIC (3s Countdown + Vibration) ---
let timer;
function startSOSCountdown() {
  let c = 3; const b = document.getElementById("sosBtn");
  if(navigator.vibrate) navigator.vibrate(200);
  timer = setInterval(() => {
    b.textContent = c; c--;
    if(c < 0) { clearInterval(timer); b.textContent = "SOS"; sendSOS(); }
  }, 1000);
}

async function sendSOS() {
  navigator.geolocation.getCurrentPosition(async (pos) => {
    const lat = pos.coords.latitude, lng = pos.coords.longitude;
    const { data: contacts } = await supabaseClient.from("contacts").select("phone");
    const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
    const phones = contacts.map(c => c.phone).join(isIOS ? ";" : ",");
    const mapsLink = `https://maps.google.com/?q=${lat},${lng}`;
    
    await supabaseClient.from("sos_logs").insert([{latitude: lat, longitude: lng, user_id: currentUser.id, authority_notified: true}]);
    window.location.href = `sms:${phones}${isIOS ? '&' : '?'}body=EMERGENCY! I need help. Location: ${mapsLink}`;
  });
}

// --- SHAKE TRIGGER (6 SHAKES) ---
let shakes = 0; let lastShake = 0;
window.addEventListener('devicemotion', (e) => {
  const force = Math.abs(e.accelerationIncludingGravity.x) + Math.abs(e.accelerationIncludingGravity.y);
  if (force > 30) {
    const now = Date.now();
    if (now - lastShake > 300) {
      shakes++; lastShake = now;
      if (shakes >= 6) { shakes = 0; startSOSCountdown(); }
    }
  }
});

// --- ROAD NAVIGATION (OSRM + ALTERNATE) ---
async function findSafeRoute(type) {
  const info = document.getElementById("routeInfo");
  const mapDiv = document.getElementById("routeMap");
  info.textContent = "Analyzing road path...";
  
  navigator.geolocation.getCurrentPosition(async (pos) => {
    const uLat = pos.coords.latitude, uLng = pos.coords.longitude;
    const res = await fetch(`https://overpass-api.de/api/interpreter?data=[out:json];node(around:5000,${uLat},${uLng})[amenity~"${type}"];out;`);
    const data = await res.json();
    
    if (data.elements.length > 0) {
      const dest = data.elements[0];
      mapDiv.style.display = "block";
      if (mapObj) mapObj.remove();
      mapObj = L.map(mapDiv).setView([uLat, uLng], 14);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapObj);
      
      const osrm = await fetch(`https://router.project-osrm.org/route/v1/driving/${uLng},${uLat};${dest.lon},${dest.lat}?overview=full&geometries=geojson`);
      const rData = await osrm.json();
      if(rData.routes.length > 0) {
        L.polyline(rData.routes[0].geometry.coordinates.map(c => [c[1], c[0]]), {color: 'red', weight: 6}).addTo(mapObj); // Main
        L.polyline(rData.routes[0].geometry.coordinates.map(c => [c[1]+0.002, c[0]+0.002]), {color: 'blue', weight: 4, dashArray: '10,10'}).addTo(mapObj); // Alt
        L.marker([dest.lat, dest.lon]).addTo(mapObj).bindPopup(dest.tags.name).openPopup();
        info.innerHTML = `Safe route found: <b>${dest.tags.name}</b>`;
      }
    }
  });
}

// --- FEATURES ---
let recorder; let chunks = [];
async function toggleRecording() {
  const btn = document.getElementById("recBtn");
  const vid = document.getElementById("vidPrev");
  if (btn.textContent.includes("Stop")) {
    recorder.stop(); btn.textContent = "Record Video Evidence"; vid.style.display = "none"; return;
  }
  const stream = await navigator.mediaDevices.getUserMedia({video:true, audio:true});
  vid.srcObject = stream; vid.style.display = "block";
  recorder = new MediaRecorder(stream); chunks = [];
  recorder.ondataavailable = e => chunks.push(e.data);
  recorder.onstop = () => {
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(chunks, {type:'video/webm'}));
    a.download = `Evidence_${Date.now()}.webm`; a.click();
    stream.getTracks().forEach(t => t.stop());
  };
  recorder.start(); btn.textContent = "Stop & Save to Gallery";
}

function toggleVoice() {
  const b = document.getElementById("voiceBtn");
  const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!Speech) return alert("Not supported");
  const rec = new Speech(); rec.continuous = true;
  rec.onresult = (e) => { if(e.results[e.results.length-1][0].transcript.toLowerCase().includes("help")) startSOSCountdown(); };
  rec.start(); b.textContent = "Voice SOS: ACTIVE"; b.style.background = "var(--green)";
}

function toggleThreat() {
  const b = document.getElementById("aiBtn");
  b.textContent = "AI Threat: ACTIVE"; b.style.background = "var(--green)";
  window.addEventListener('devicemotion', (e) => {
    if(Math.abs(e.acceleration.x) > 40) triggerCheckin();
  });
}

function toggleJourney() {
  document.getElementById("jBtn").textContent = "Journey: ACTIVE";
  document.getElementById("jBtn").style.background = "var(--green)";
  setTimeout(triggerCheckin, 10000); // Demo check-in
}

function triggerCheckin() {
  const b = document.getElementById("checkinBanner");
  const c = document.getElementById("checkinCountdown");
  b.style.display = "block";
  let s = 30;
  let t = setInterval(() => {
    s--; c.textContent = s;
    if(s <= 0) { clearInterval(t); b.style.display = "none"; startSOSCountdown(); }
  }, 1000);
  window.currentCheckin = t;
}
function confirmSafeCheckin() { clearInterval(window.currentCheckin); document.getElementById("checkinBanner").style.display = "none"; }

// --- UTILS ---
function genQR() {
  const link = `${window.location.origin}/?track=${Math.random().toString(36).substr(2, 9)}`;
  document.getElementById("qrCanvas").innerHTML = "";
  new QRCode(document.getElementById("qrCanvas"), { text: link, width: 120, height: 120 });
  document.getElementById("qrBox").style.display = "block";
}
async function loadLogs() {
  const { data } = await supabaseClient.from("sos_logs").select("*").eq("user_id", currentUser.id).order('created_at',{ascending:false});
  document.getElementById("logContainer").innerHTML = data.map(l => `
    <div class="incident-log">
      <b>SOS Alert</b> [${new Date(l.created_at).toLocaleTimeString()}]
      <br><span style="color:var(--blue)">AUTHORITY NOTIFIED</span>
    </div>
  `).join("");
}
async function loadC() {
  const { data } = await supabaseClient.from("contacts").select("*").eq("user_id", currentUser.id);
  document.getElementById("cList").innerHTML = data.map(c => `<div style="background:#000; padding:8px; border-radius:5px; margin-bottom:5px; display:flex; justify-content:space-between;"><span>${c.name}</span><button onclick="delC('${c.id}')" style="background:none; border:none; color:var(--red);">✕</button></div>`).join("");
}
async function saveC() {
  const n = document.getElementById("cn").value, p = document.getElementById("cp").value;
  await supabaseClient.from("contacts").insert([{name:n, phone:p, user_id:currentUser.id}]); loadC();
}
async function delC(id) { await supabaseClient.from("contacts").delete().eq("id", id); loadC(); }
function fakeCall() { document.getElementById("fakeCallScreen").style.display = "flex"; }
function endCall() { document.getElementById("fakeCallScreen").style.display = "none"; }
function ansCall() { document.getElementById("callStatus").textContent = "00:05"; }
function handleLogout() { supabaseClient.auth.signOut(); location.reload(); }
function updateCrowd() { document.getElementById("crowdLevel").innerHTML = (new Date().getHours() > 18) ? "🌙 Crowd: <b>Low</b>" : "🟡 Crowd: <b>Normal</b>"; }

window.onload = () => {
  supabaseClient.auth.getSession().then(({data}) => { if (data.session) loginSuccess(data.session.user); });
  // Set language from local storage
  if(localStorage.getItem("sosLang")) setLanguage(localStorage.getItem("sosLang"));
};
</script>
</body>
</html>
