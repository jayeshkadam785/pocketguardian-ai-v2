<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PocketGuardian AI Pro - Mobile Tactical</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root { --bg: #050507; --panel: #11111a; --red: #ff3b5c; --green: #34c759; --blue: #3b82f6; --orange: #f59e0b; --purple: #a855f7; --wa: #075e54; }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: #f1f1f1; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; min-height: 100vh; overflow-x: hidden; }
  
  .app-container { display: flex; flex-direction: column; width: 100%; min-height: 100vh; }
  .header { background: #000; padding: 15px; border-bottom: 2px solid var(--red); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
  .main-content { padding: 15px; display: flex; flex-direction: column; gap: 15px; }

  .sos-wrap { display: flex; flex-direction: column; align-items: center; margin: 10px 0; }
  .sos-btn { width: 160px; height: 160px; border-radius: 50%; background: radial-gradient(circle, #ff3b5c, #8b0000); border: 5px solid #000; color: white; font-size: 40px; font-weight: 900; box-shadow: 0 0 40px rgba(255,59,92,0.5); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
  .sos-btn:active { transform: scale(0.85); }

  .card { background: var(--panel); border-radius: 15px; padding: 15px; border: 1px solid #222; }
  .card h3 { font-size: 13px; margin-bottom: 12px; color: var(--red); text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; gap: 8px; }

  .btn { width: 100%; padding: 15px; border: none; border-radius: 12px; color: white; font-weight: bold; cursor: pointer; margin-bottom: 10px; font-size: 14px; display: flex; align-items: center; justify-content: center; }
  input { width: 100%; padding: 14px; background: #000; border: 1px solid #333; border-radius: 10px; color: white; margin-bottom: 10px; font-size: 15px; }

  .audio-wave { display: flex; align-items: flex-end; gap: 3px; height: 20px; margin: 10px 0; }
  .audio-bar { width: 4px; background: var(--green); animation: wave 0.8s infinite; border-radius: 2px; }
  @keyframes wave { 0%, 100% { height: 5px; } 50% { height: 20px; } }

  .full-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 100000; flex-direction: column; }
  #historyOverlay { background: var(--bg); overflow-y: auto; padding: 20px; }
  
  #authScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 200000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 25px; }
</style>
</head>
<body>

<!-- HISTORY OVERLAY (NEW) -->
<div id="historyOverlay" class="full-overlay">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; padding-bottom:10px; border-bottom:1px solid #333;">
        <h2 style="color:var(--red); font-size:20px;">INCIDENT HISTORY</h2>
        <button onclick="closeHistory()" style="background:none; border:1px solid var(--red); color:var(--red); padding:5px 15px; border-radius:20px;">BACK</button>
    </div>
    <div id="fullHistoryContent"></div>
</div>

<!-- GHOST MODE & AUTH remain same -->
<div id="whatsappGhost" class="full-overlay" onclick="exitGhost()">
    <div style="background:var(--wa); color:white; padding:15px; display:flex; align-items:center; gap:12px;">
        <div style="width:38px; height:38px; background:#ccc; border-radius:50%;"></div>
        <span style="font-size: 18px; font-weight: 500;">Mom ❤️</span>
    </div>
    <div style="flex: 1; background: #e5ddd5; padding: 15px;">
        <div style="background:white; padding:10px; border-radius:10px; margin-bottom:10px; max-width:80%; color:black;">Beta kahan ho?</div>
        <div style="background:#dcf8c6; padding:10px; border-radius:10px; align-self:flex-end; margin-bottom:10px; max-width:80%; color:black; margin-left:auto;">Bus 5 mins me aa rahi hu.</div>
    </div>
</div>

<div id="authScreen">
    <h1 style="color:var(--red); font-size:32px; font-weight:900;">POCKET GUARDIAN</h1>
    <div class="card" style="width:100%; max-width:340px; margin-top:20px;">
        <input type="email" id="authEmail" placeholder="Email Address">
        <input type="password" id="authPassword" placeholder="Password">
        <button class="btn" style="background:var(--red);" onclick="handleAuthSubmit()">LOGIN / SIGN UP</button>
        <a href="#" onclick="handleForgot()" style="color:#666; font-size:12px; display:block; text-align:center; margin-top:10px; text-decoration:none;">Forgot Password?</a>
    </div>
</div>

<div class="app-container" id="mainApp" style="display:none;">
    <div class="header">
        <div style="color:var(--red); font-weight:900; letter-spacing:1px;">POCKETGUARDIAN AI</div>
        <select id="langSelector" onchange="setLanguage(this.value)" style="padding:6px; background:#222; color:white; border:none; border-radius:5px; font-size:11px;">
            <option value="en">English</option><option value="hi">हिंदी</option><option value="mr">मराठी</option>
        </select>
    </div>

    <div class="main-content">
        <!-- SOS BUTTON -->
        <div class="sos-wrap">
            <button class="sos-btn" id="sosBtn" onclick="startSOSCountdown()">SOS</button>
            <div id="status" style="margin-top:15px; font-weight:bold; color:var(--green); font-size:14px;">SHIELD: ACTIVE</div>
        </div>

        <!-- COMMAND FEED (UPDATED) -->
        <div class="card">
            <h3>🚨 Police Command Feed</h3>
            <div id="icccFeed"></div>
            <button id="readAllBtn" class="btn" style="background:#222; font-size:12px; margin-top:10px; display:none;" onclick="showFullHistory()">Read All Logs →</button>
        </div>

        <!-- NAVIGATION -->
        <div class="card">
            <h3>📍 Tactical Navigation</h3>
            <button class="btn" style="background:var(--green);" onclick="findHelpRoute('police')">Nearest Police Station</button>
            <button class="btn" style="background:#0891b2;" onclick="findHelpRoute('hospital')">Nearest Hospital</button>
            <div id="routeMap" style="height:250px; width:100%; border-radius:12px; margin-top:10px; display:none;"></div>
        </div>

        <!-- STEALTH -->
        <div class="card">
            <h3>🎭 Stealth Mode</h3>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                <button class="btn" style="background:var(--wa);" onclick="enterGhost('wa')">WA Ghost</button>
                <button class="btn" style="background:#333;" onclick="enterGhost('dead')">Update Ghost</button>
            </div>
            <button class="btn" style="background:var(--purple);" id="shakeBtn" onclick="toggleShake()">Enable Shake SOS: <b id="shakeState">OFF</b></button>
        </div>

        <!-- CONTACTS -->
        <div class="card">
            <h3>👥 Personal Contacts</h3>
            <input type="text" id="cn" placeholder="Name">
            <input type="tel" id="cp" placeholder="Phone">
            <button class="btn" style="background:var(--red);" onclick="saveContact()">+ Add Member</button>
            <div id="contactList"></div>
            <button onclick="handleLogout()" style="width:100%; background:none; border:none; color:#444; font-size:12px; margin-top:30px;">Logout Account</button>
        </div>
    </div>
</div>

<script>
const SUPABASE_URL = "https://xccnzedcdeecfmhxiwxs.supabase.co";
const SUPABASE_KEY = "sb_publishable_Rj_HX1xUGpa-tzhsIPWeqw_6IZx0fEy";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null, mapObj = null, shakeActive = false;

// --- AUTH ---
async function handleAuthSubmit() {
    const e = document.getElementById("authEmail").value, p = document.getElementById("authPassword").value;
    const { data, error } = await supabaseClient.auth.signInWithPassword({ email: e, password: p });
    if (!error) loginSuccess(data.user);
    else {
        const { error: sErr } = await supabaseClient.auth.signUp({ email: e, password: p });
        if (!sErr) alert("Verify email!"); else document.getElementById("authError").textContent = sErr.message;
    }
}
function loginSuccess(user) { currentUser = user; document.getElementById("authScreen").style.display="none"; document.getElementById("mainApp").style.display="flex"; loadContacts(); loadICCC(); }

// --- SOS ---
function startSOSCountdown() {
    let c = 3; const b = document.getElementById("sosBtn");
    if(navigator.vibrate) navigator.vibrate(200);
    const t = setInterval(() => {
        b.textContent = c; c--;
        if(c < 0) { clearInterval(t); b.textContent = "SOS"; executeSOS(); }
    }, 1000);
}
async function executeSOS() {
    navigator.geolocation.getCurrentPosition(async (pos) => {
        const { latitude, longitude } = pos.coords;
        await supabaseClient.from("sos_logs").insert([{latitude, longitude, user_id: currentUser.id, status:'verified'}]);
        alert("ICCC DISPATCHED!"); loadICCC();
    });
}

// --- UPDATED COMMAND FEED LOGIC (READ ALL) ---
async function loadICCC() {
    const { data } = await supabaseClient.from("sos_logs").select("*").eq("user_id", currentUser.id).order('created_at',{ascending:false});
    const feed = document.getElementById("icccFeed");
    const readAllBtn = document.getElementById("readAllBtn");

    if (data && data.length > 0) {
        // केवल सबसे पहला (Latest) रिकॉर्ड दिखाएं
        const latest = data[0];
        feed.innerHTML = `
            <div style="background:#000; padding:15px; border-radius:12px; border-left:4px solid var(--red); margin-bottom:5px;">
                <div style="display:flex; justify-content:space-between; font-size:11px; color:#666; margin-bottom:10px;">
                    <span style="color:var(--red); font-weight:bold; animation: blink 1s infinite;">🔴 ACTIVE ALERT</span>
                    <span>${new Date(latest.created_at).toLocaleTimeString()}</span>
                </div>
                <div style="color:var(--green); font-size:12px; font-weight:bold;">🎤 AUDIO TAP: ACTIVE</div>
                <div class="audio-wave">
                    <div class="audio-bar"></div><div class="audio-bar"></div><div class="audio-bar"></div><div class="audio-bar"></div>
                </div>
                <a href="https://maps.google.com/?q=${latest.latitude},${latest.longitude}" target="_blank" style="color:var(--blue); font-size:12px; text-decoration:none;">OPEN COMMAND MAP →</a>
            </div>
        `;
        
        // अगर 1 से ज्यादा रिकॉर्ड हैं, तो Read All बटन दिखाएं
        if (data.length > 1) {
            readAllBtn.style.display = "flex";
            readAllBtn.textContent = `Read All History (${data.length} Logs)`;
        }
    } else {
        feed.innerHTML = `<p style="font-size:12px; color:#555; text-align:center;">No recent SOS activity.</p>`;
    }
}

function showFullHistory() {
    document.getElementById("historyOverlay").style.display = "flex";
    const historyContent = document.getElementById("fullHistoryContent");
    
    supabaseClient.from("sos_logs").select("*").eq("user_id", currentUser.id).order('created_at',{ascending:false}).then(({data}) => {
        historyContent.innerHTML = data.map(l => `
            <div style="background:var(--panel); padding:15px; border-radius:12px; margin-bottom:12px; border:1px solid #333;">
                <div style="display:flex; justify-content:space-between; font-size:12px; margin-bottom:8px;">
                    <span style="color:#999;">${new Date(l.created_at).toLocaleDateString()}</span>
                    <span style="color:#999;">${new Date(l.created_at).toLocaleTimeString()}</span>
                </div>
                <div style="font-size:14px; font-weight:bold; color:var(--orange);">Log ID: #T-${l.id.toString().substr(0,5)}</div>
                <a href="https://maps.google.com/?q=${l.latitude},${l.longitude}" target="_blank" style="display:block; margin-top:10px; color:var(--blue); text-decoration:none;">View Map Location →</a>
            </div>
        `).join("");
    });
}

function closeHistory() { document.getElementById("historyOverlay").style.display = "none"; }

// --- OTHERS ---
function toggleShake() { shakeActive = !shakeActive; document.getElementById("shakeState").textContent = shakeActive ? "ON" : "OFF"; }
window.addEventListener('devicemotion', (e) => { if(shakeActive && Math.abs(e.accelerationIncludingGravity.x) > 30) startSOSCountdown(); });
function enterGhost(m) { if(m === 'wa') document.getElementById("whatsappGhost").style.display="flex"; else document.getElementById("blackGhost").style.display="flex"; executeSOS(); }
function exitGhost() { if(prompt("Tactical PIN:") === "1234") document.querySelectorAll(".full-overlay").forEach(e => e.style.display="none"); }
async function loadContacts() {
    const { data } = await supabaseClient.from("contacts").select("*").eq("user_id", currentUser.id);
    document.getElementById("contactList").innerHTML = data.map(c => `<div style="background:#000; padding:12px; border-radius:10px; margin-bottom:8px; display:flex; justify-content:space-between;"><span>${c.name}</span><button onclick="delC('${c.id}')" style="background:none; border:none; color:var(--red);">✕</button></div>`).join("");
}
async function saveContact() { const n = document.getElementById("cn").value, p = document.getElementById("cp").value; await supabaseClient.from("contacts").insert([{name:n, phone:p, user_id:currentUser.id}]); loadContacts(); }
function delC(id) { supabaseClient.from("contacts").delete().eq("id", id).then(loadContacts); }
function handleLogout() { supabaseClient.auth.signOut(); location.reload(); }

window.onload = () => { supabaseClient.auth.getSession().then(({data}) => { if (data.session) loginSuccess(data.session.user); }); };
</script>
</body>
</html>
