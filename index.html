<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PocketGuardian AI</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#c0154a">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0a0a0f; color: #f1f1f1; font-family: 'Segoe UI', sans-serif;
    min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px;
  }
  h1 { color: #ff3b5c; margin: 20px 0 5px; font-size: 28px; }
  .subtitle { color: #999; font-size: 13px; margin-bottom: 25px; text-align: center; }
  .sos-btn {
    width: 180px; height: 180px; border-radius: 50%;
    background: radial-gradient(circle, #ff3b5c, #b8002e);
    border: none; color: white; font-size: 36px; font-weight: bold;
    box-shadow: 0 0 30px rgba(255,59,92,0.6); cursor: pointer; transition: transform 0.15s;
    display: flex; align-items: center; justify-content: center;
  }
  .sos-btn:active { transform: scale(0.95); }
  .status { margin-top: 20px; font-size: 14px; color: #4ade80; min-height: 20px; text-align: center; }
  .section { width: 100%; max-width: 420px; background: #16161f; border-radius: 14px; padding: 18px; margin-top: 25px; }
  .section h3 { font-size: 15px; color: #ff3b5c; margin-bottom: 12px; }
  input { width: 100%; padding: 10px; margin-bottom: 8px; border-radius: 8px; border: 1px solid #333; background: #0a0a0f; color: white; font-size: 14px; }
  .add-btn { width: 100%; padding: 10px; background: #ff3b5c; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; margin-top: 5px; }
  .contact-item { display: flex; justify-content: space-between; align-items: center; background: #0a0a0f; padding: 10px 12px; border-radius: 8px; margin-bottom: 8px; font-size: 14px; }
  .del-btn { background: none; border: none; color: #ff3b5c; cursor: pointer; font-size: 16px; }
  .police-item { background: #0a0a0f; padding: 10px 12px; border-radius: 8px; margin-bottom: 8px; font-size: 13px; display: flex; justify-content: space-between; }
  .police-item a { color: #4ade80; text-decoration: none; font-weight: bold; }
  .fake-call-btn { width: 100%; padding: 12px; background: #333; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; margin-top: 10px; }
  .lang-selector { position: fixed; top: 14px; right: 14px; background: #16161f; color: white; border: 1px solid #333; border-radius: 8px; padding: 6px 8px; font-size: 13px; z-index: 9999; }
  .fake-call-screen { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(180deg, #1a2a3a, #0a0a0f 60%); z-index: 9999; flex-direction: column; justify-content: space-between; align-items: center; padding: 60px 20px 50px; }
  #mainAppScreen { display: none; flex-direction: column; align-items: center; width: 100%; }
  #routeMapContainer { height: 300px; width: 100%; border-radius: 10px; overflow: hidden; margin-top: 10px; display: none; border: 1px solid #333; }
  #checkinBanner { display: none; position: fixed; top: 0; left: 0; width: 100%; background: #b8002e; color: white; padding: 16px 20px; text-align: center; z-index: 10000; font-size: 15px; }
  #checkinBanner button { margin-top: 10px; padding: 8px 16px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; background: #34c759; color: white;}
</style>
</head>
<body>

<div id="checkinBanner">
  <div id="checkinText">Are you okay? Auto-alert in <span id="checkinCountdown">30</span>s</div>
  <button onclick="confirmSafeCheckin()">✅ I'm Fine</button>
</div>

<!-- All original screens remain here -->
<div id="authScreen" style="width:100%; max-width:420px; padding-top:60px; display:flex; flex-direction:column; align-items:center;">
  <h1>🛡️ PocketGuardian AI</h1>
  <div class="subtitle">Sign in to your safety dashboard</div>
  <div class="section" style="width:100%;">
    <h3 id="authFormTitle">Login</h3>
    <input type="email" id="authEmail" placeholder="Email">
    <input type="password" id="authPassword" placeholder="Password">
    <button class="add-btn" onclick="handleAuthSubmit()" id="authSubmitBtn">Login</button>
    <div id="authError" style="color:#ff6b6b; font-size:13px; margin-top:8px; text-align:center;"></div>
    <div style="text-align:center; margin-top:14px; font-size:13px; color:#999;">
      <a href="#" onclick="toggleAuthMode(); return false;" style="color:#4ade80; font-weight:bold;" id="authToggleLink">Sign Up</a>
    </div>
  </div>
</div>

<div id="mainAppScreen">
<select class="lang-selector" id="langSelector" onchange="setLanguage(this.value)">
  <option value="en">English</option><option value="hi">हिंदी</option><option value="mr">मराठी</option>
  <option value="gu">ગુજરાતી</option><option value="ur">اردو</option><option value="bn">বাংলা</option>
  <option value="ta">தமிழ்</option><option value="te">తెలుగు</option><option value="kn">ಕನ್ನಡ</option>
</select>
<button onclick="handleLogout()" style="position:fixed; top:14px; left:14px; background:#16161f; color:#ff6b6b; border:1px solid #333; border-radius:8px; padding:6px 12px; font-size:12px; z-index:10000;">Logout</button>

<h1>🛡️ <span id="txt-title">PocketGuardian AI</span></h1>
<div class="subtitle" id="txt-subtitle">SOS Safety — One tap sends location to everyone</div>

<button class="sos-btn" id="sosBtn" onclick="startSOSCountdown()">SOS</button>
<div class="status" id="status"></div>
<button id="cancelSosBtn" onclick="cancelSOSCountdown()" style="display:none; margin-top:10px; padding:10px 20px; background:#333; border:none; border-radius:8px; color:white; font-weight:bold; cursor:pointer;">Cancel</button>

<button class="fake-call-btn" onclick="fakeCall()">📞 <span id="txt-fakecall">Emergency Call</span></button>

<!-- Features Sections -->
<div class="section">
  <h3>Emergency Contacts</h3>
  <input type="text" id="contactName" placeholder="Name">
  <input type="tel" id="contactPhone" placeholder="91XXXXXXXXXX">
  <button class="add-btn" onclick="addContact()">+ Add Contact</button>
  <div id="contactList" style="margin-top:12px;"></div>
</div>

<div class="section">
  <h3>🧭 Safe Routes & Navigation</h3>
  <button class="add-btn" style="background:#14b8a6;" onclick="findNearestSafeLocation()">Find Nearest Safety & Show Routes</button>
  <div id="nearestSafeInfo" style="margin-top:8px; font-size:13px; color:#5eead4; text-align:center;"></div>
  <div id="routeMapContainer"></div>
</div>

<div class="section">
  <h3>🛠️ Advanced Safety Tools</h3>
  <button class="add-btn" style="background:#34c759; margin-bottom:10px;" onclick="imSafe()">✅ I'm Safe (Update Family)</button>
  <button class="add-btn" style="background:#3b82f6; margin-bottom:10px;" onclick="toggleLiveShare()" id="liveShareBtn">📍 Live Share & QR Code</button>
  <div id="liveShareInfo" style="font-size:12px; color:#4ade80; text-align:center; word-break:break-all;"></div>
  <div id="qrCodeBox" style="display:none; background:white; padding:10px; border-radius:10px; margin: 10px auto; width:180px;"><div id="qrCodeCanvas"></div></div>

  <button class="add-btn" style="background:#ff9d4d; margin-bottom:10px;" onclick="toggleRecording()" id="recordBtn">🎥 Record Video Evidence</button>
  <div id="recordingInfo" style="font-size:12px; color:#ff9d4d; text-align:center;"></div>
  <video id="evidencePreview" autoplay muted playsinline style="display:none; width:100%; border-radius:10px; margin-top:10px; background:#000;"></video>

  <button class="add-btn" style="background:#a855f7; margin-top:10px;" onclick="enableShakeToSOS()" id="shakeBtn">🤳 Enable Shake (6x) to SOS</button>
  <button class="add-btn" style="background:#ec4899; margin-top:10px;" onclick="toggleVoiceSOS()">🎤 Enable Voice SOS (Say Help)</button>
  <button class="add-btn" style="background:#dc2626; margin-top:10px;" onclick="toggleThreatDetection()">🛡️ Enable AI Threat Detection</button>
  <button class="add-btn" style="background:#0ea5e9; margin-top:10px;" onclick="toggleJourneyMode()">🚶 Journey & Crowd Monitor</button>
  <button class="add-btn" style="background:#f59e0b; margin-top:10px;" onclick="toggleIncidentDashboard()">📋 My Incident Dashboard</button>
  <div id="incidentDashboard" style="display:none; margin-top:10px;"></div>
</div>

<div class="section">
  <h3 id="txt-police-h">Satara & Pune Police (Backup)</h3>
  <div id="policeList"></div>
</div>

</div>

<script>
// --- CONFIG & DATA ---
const SUPABASE_URL = "https://xccnzedcdeecfmhxiwxs.supabase.co";
const SUPABASE_KEY = "sb_publishable_Rj_HX1xUGpa-tzhsIPWeqw_6IZx0fEy";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;
let routeLeafletMap = null;
let currentLang = "en";

// Purana Satara/Pune Data
const backupPolice = [
  { name: "Satara City Police", phone: "02162-232133", lat: 17.6805, lng: 74.0183 },
  { name: "Pune Shivajinagar Police", phone: "020-25536263", lat: 18.5314, lng: 73.8444 },
  { name: "Satara Women Cell", phone: "1091", lat: 17.6963, lng: 73.9862 }
];

// --- AUTH ---
async function handleAuthSubmit() {
  const email = document.getElementById("authEmail").value.trim();
  const password = document.getElementById("authPassword").value;
  try {
    if (isSignupMode) {
      await supabaseClient.auth.signUp({ email, password });
      alert("Verification email sent!");
    } else {
      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) throw error;
      onAuthSuccess(data.user);
    }
  } catch (e) { document.getElementById("authError").textContent = e.message; }
}

function onAuthSuccess(user) {
  currentUser = user;
  document.getElementById("authScreen").style.display = "none";
  document.getElementById("mainAppScreen").style.display = "flex";
  loadContacts(); renderBackupPolice();
}

let isSignupMode = false;
function toggleAuthMode() {
  isSignupMode = !isSignupMode;
  document.getElementById("authFormTitle").textContent = isSignupMode ? "Sign Up" : "Login";
}

// --- SOS WITH COUNTDOWN (FIXED) ---
let sosTimer = null;
function startSOSCountdown() {
  let count = 3;
  const btn = document.getElementById("sosBtn");
  const cancel = document.getElementById("cancelSosBtn");
  cancel.style.display = "block";
  btn.textContent = count;
  if (navigator.vibrate) navigator.vibrate(200);

  sosTimer = setInterval(() => {
    count--;
    if (count <= 0) {
      clearInterval(sosTimer);
      btn.textContent = "SOS";
      cancel.style.display = "none";
      executeSOS();
    } else {
      btn.textContent = count;
      if (navigator.vibrate) navigator.vibrate(100);
    }
  }, 1000);
}

function cancelSOSCountdown() {
  clearInterval(sosTimer);
  document.getElementById("sosBtn").textContent = "SOS";
  document.getElementById("cancelSosBtn").style.display = "none";
}

async function executeSOS() {
  navigator.geolocation.getCurrentPosition(async (pos) => {
    const lat = pos.coords.latitude, lng = pos.coords.longitude;
    const { data: contacts } = await supabaseClient.from("contacts").select("phone");
    if (!contacts || contacts.length === 0) return alert("Add contacts first!");

    const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
    const phones = contacts.map(c => c.phone).join(isIOS ? ";" : ",");
    const mapsLink = `https://maps.google.com/?q=${lat},${lng}`;
    const msg = encodeURIComponent("EMERGENCY! I need help. Location: " + mapsLink);
    
    await supabaseClient.from("sos_logs").insert([{latitude: lat, longitude: lng, user_id: currentUser.id}]);
    window.location.href = `sms:${phones}${isIOS ? '&' : '?'}body=${msg}`;
  });
}

// --- SHAKE TO SOS (6 TIMES) ---
let shakeCount = 0;
let lastShake = 0;
async function enableShakeToSOS() {
  if (typeof DeviceMotionEvent.requestPermission === 'function') {
    const res = await DeviceMotionEvent.requestPermission();
    if (res !== 'granted') return;
  }
  window.addEventListener('devicemotion', (e) => {
    const acc = e.accelerationIncludingGravity;
    const force = Math.abs(acc.x) + Math.abs(acc.y) + Math.abs(acc.z);
    if (force > 30) {
      const now = Date.now();
      if (now - lastShake > 300) {
        shakeCount++; lastShake = now;
        if (shakeCount >= 6) { shakeCount = 0; startSOSCountdown(); }
      }
    }
  });
  document.getElementById("shakeBtn").textContent = "🤳 Shake SOS: ACTIVE";
}

// --- NAVIGATION & ALTERNATE ROUTES (FIXED) ---
async function findNearestSafeLocation() {
  const info = document.getElementById("nearestSafeInfo");
  const mapDiv = document.getElementById("routeMapContainer");
  info.textContent = "Calculating routes...";
  navigator.geolocation.getCurrentPosition(async (pos) => {
    const uLat = pos.coords.latitude, uLng = pos.coords.longitude;
    const query = `[out:json];node(around:5000,${uLat},${uLng})[amenity~"police|hospital"];out;`;
    const res = await fetch(`https://overpass-api.de/api/interpreter?data=${encodeURIComponent(query)}`);
    const data = await res.json();
    
    mapDiv.style.display = "block";
    if (routeLeafletMap) routeLeafletMap.remove(); // FIXED CRASH
    routeLeafletMap = L.map(mapDiv).setView([uLat, uLng], 14);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(routeLeafletMap);

    if (data.elements.length > 0) {
      const dest = data.elements[0];
      L.marker([uLat, uLng]).addTo(routeLeafletMap).bindPopup("You");
      L.marker([dest.lat, dest.lon]).addTo(routeLeafletMap).bindPopup(dest.tags.name).openPopup();
      
      // Main Route
      L.polyline([[uLat, uLng], [dest.lat, dest.lon]], {color: 'red', weight: 6}).addTo(routeLeafletMap);
      // Alternate Route
      L.polyline([[uLat, uLng], [dest.lat+0.003, dest.lon+0.003], [dest.lat, dest.lon]], {color: 'blue', weight: 4, dashArray: '5,10'}).addTo(routeLeafletMap);
      
      info.innerHTML = `Main (Red) | Alternate (Blue Dotted) <br> To: ${dest.tags.name}`;
    }
  });
}

// --- RECORD VIDEO (AUTO-SAVE) ---
let mediaRecorder; let chunks = [];
async function toggleRecording() {
  const btn = document.getElementById("recordBtn");
  const video = document.getElementById("evidencePreview");
  if (btn.dataset.active === "true") {
    mediaRecorder.stop();
    btn.dataset.active = "false"; btn.textContent = "🎥 Record Video Evidence";
    video.style.display = "none"; return;
  }
  const stream = await navigator.mediaDevices.getUserMedia({video: true, audio: true});
  video.srcObject = stream; video.style.display = "block";
  mediaRecorder = new MediaRecorder(stream); chunks = [];
  mediaRecorder.ondataavailable = (e) => chunks.push(e.data);
  mediaRecorder.onstop = () => {
    const blob = new Blob(chunks, {type: 'video/webm'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url;
    a.download = `PG_Evidence_${Date.now()}.webm`; a.click();
    stream.getTracks().forEach(t => t.stop());
  };
  mediaRecorder.start(); btn.dataset.active = "true"; btn.textContent = "⏹️ Stop and Save to Gallery";
}

// --- QR CODE & LIVE SHARE ---
async function toggleLiveShare() {
  const btn = document.getElementById("liveShareBtn");
  const info = document.getElementById("liveShareInfo");
  const qrBox = document.getElementById("qrCodeBox");
  if (btn.dataset.active === "true") {
    btn.dataset.active = "false"; qrBox.style.display = "none"; info.textContent = ""; return;
  }
  const id = "TRK_" + Math.random().toString(36).substr(2, 8);
  const link = `${window.location.origin}/?track=${id}`;
  document.getElementById("qrCodeCanvas").innerHTML = "";
  new QRCode(document.getElementById("qrCodeCanvas"), { text: link, width: 160, height: 160 });
  qrBox.style.display = "block"; info.innerHTML = `Link: ${link}`;
  btn.dataset.active = "true";
}

// --- JOURNEY & DASHBOARD (STUBS) ---
function toggleJourneyMode() { alert("Journey monitoring active. Checking crowd level..."); }
async function toggleIncidentDashboard() {
  const d = document.getElementById("incidentDashboard");
  d.style.display = d.style.display === "none" ? "block" : "none";
  if (d.style.display === "block") {
    const { data } = await supabaseClient.from("sos_logs").select("*").eq("user_id", currentUser.id);
    d.innerHTML = data.map(l => `<div class="police-item"><span>${new Date(l.created_at).toLocaleDateString()}</span><a href="https://maps.google.com/?q=${l.latitude},${l.longitude}" target="_blank">View Map</a></div>`).join("");
  }
}

// --- UTILS ---
function renderBackupPolice() {
  const l = document.getElementById("policeList");
  l.innerHTML = backupPolice.map(p => `<div class="police-item"><span>${p.name}</span><a href="tel:${p.phone}">Call</a></div>`).join("");
}
async function loadContacts() {
  const { data } = await supabaseClient.from("contacts").select("*").eq("user_id", currentUser.id);
  const list = document.getElementById("contactList"); list.innerHTML = "";
  if (data) data.forEach(c => {
    const div = document.createElement("div"); div.className="contact-item";
    div.innerHTML = `<span>${c.name} - ${c.phone}</span><button class="del-btn" onclick="deleteContact('${c.id}')">✕</button>`;
    list.appendChild(div);
  });
}
async function addContact() {
  const n = document.getElementById("contactName").value, p = document.getElementById("contactPhone").value;
  await supabaseClient.from("contacts").insert([{name: n, phone: p, user_id: currentUser.id}]); loadContacts();
}
async function deleteContact(id) { await supabaseClient.from("contacts").delete().eq("id", id); loadContacts(); }
function fakeCall() { alert("Simulating incoming call..."); }
function handleLogout() { supabaseClient.auth.signOut(); location.reload(); }

window.onload = () => {
  supabaseClient.auth.getSession().then(({data}) => { if (data.session) onAuthSuccess(data.session.user); });
};
</script>
</body>
</html>
