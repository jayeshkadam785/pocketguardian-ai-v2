// --- SOS LOGIC (3s Countdown) ---
let sosTimer = null;
function startSOSCountdown() {
  let count = 3; const btn = document.getElementById("sosBtn"); const cancel = document.getElementById("cancelSosBtn");
  btn.textContent = count; cancel.style.display = "block"; if (navigator.vibrate) navigator.vibrate(200);
  sosTimer = setInterval(() => {
    count--; if (count <= 0) { clearInterval(sosTimer); btn.textContent = "SOS"; cancel.style.display = "none"; executeSOS(); }
    else { btn.textContent = count; if (navigator.vibrate) navigator.vibrate(100); }
  }, 1000);
}
function cancelSOSCountdown() { clearInterval(sosTimer); document.getElementById("sosBtn").textContent = "SOS"; document.getElementById("cancelSosBtn").style.display = "none"; }
async function executeSOS() {
  navigator.geolocation.getCurrentPosition(async (pos) => {
    const lat = pos.coords.latitude, lng = pos.coords.longitude;
    const { data: contacts } = await supabaseClient.from("contacts").select("phone");
    if (!contacts || contacts.length === 0) return alert("Add contacts!");
    const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
    const phones = contacts.map(c => c.phone).join(isIOS ? ";" : ",");
    const mapsLink = `https://maps.google.com/?q=${lat},${lng}`;
    const msg = encodeURIComponent(`${translations[currentLang].smsMsg} ${mapsLink}`);
    await supabaseClient.from("sos_logs").insert([{latitude: lat, longitude: lng, user_id: currentUser.id}]);
    window.location.href = `sms:${phones}${isIOS ? '&' : '?'}body=${msg}`;
  });
}

// --- SHAKE TRIGGER (6x) ---
let shakeCount = 0; let lastShake = 0;
async function enableShakeToSOS() {
  if (typeof DeviceMotionEvent.requestPermission === 'function') { await DeviceMotionEvent.requestPermission(); }
  window.addEventListener('devicemotion', (e) => {
    const acc = e.accelerationIncludingGravity; const total = Math.abs(acc.x) + Math.abs(acc.y) + Math.abs(acc.z);
    if (total > 30) { const now = Date.now(); if (now - lastShake > 300) { shakeCount++; lastShake = now; if (shakeCount >= 6) { shakeCount = 0; startSOSCountdown(); } } }
  });
  document.getElementById("shakeBtn").textContent = "🤳 Shake SOS: ENABLED";
}

// --- NAVIGATION (Main + Alternate) ---
async function findNearestSafeLocation(type) {
  const info = document.getElementById("nearestSafeInfo"); const mapDiv = document.getElementById("routeMapContainer");
  info.textContent = translations[currentLang].gettingLocation;
  navigator.geolocation.getCurrentPosition(async (pos) => {
    const uLat = pos.coords.latitude, uLng = pos.coords.longitude;
    const query = `[out:json];node(around:5000,${uLat},${uLng})[amenity~"${type === 'police' ? 'police' : 'hospital'}"];out;`;
    const res = await fetch(`https://overpass-api.de/api/interpreter?data=${encodeURIComponent(query)}`);
    const data = await res.json();
    mapDiv.style.display = "block"; if (routeLeafletMap) routeLeafletMap.remove(); 
    routeLeafletMap = L.map(mapDiv).setView([uLat, uLng], 14);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(routeLeafletMap);
    if (data.elements.length > 0) {
      const dest = data.elements[0]; L.marker([uLat, uLng]).addTo(routeLeafletMap); L.marker([dest.lat, dest.lon]).addTo(routeLeafletMap).bindPopup(dest.tags.name).openPopup();
      L.polyline([[uLat, uLng], [dest.lat, dest.lon]], {color: 'red', weight: 6}).addTo(routeLeafletMap);
      L.polyline([[uLat, uLng], [dest.lat+0.003, dest.lon+0.003], [dest.lat, dest.lon]], {color: 'blue', weight: 4, dashArray: '5,10'}).addTo(routeLeafletMap);
      info.textContent = dest.tags.name;
    }
  });
}

// --- RECORD VIDEO ---
let mediaRecorder; let chunks = [];
async function toggleRecording() {
  const btn = document.getElementById("recordBtn"); const video = document.getElementById("evidencePreview");
  if (btn.dataset.active === "true") { mediaRecorder.stop(); btn.dataset.active = "false"; btn.textContent = "🎥 Record Evidence"; video.style.display = "none"; return; }
  const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
  video.srcObject = stream; video.style.display = "block";
  mediaRecorder = new MediaRecorder(stream); chunks = [];
  mediaRecorder.ondataavailable = (e) => chunks.push(e.data);
  mediaRecorder.onstop = () => {
    const blob = new Blob(chunks, { type: 'video/webm' }); const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = `PG_Evidence_${Date.now()}.webm`; a.click();
    stream.getTracks().forEach(t => t.stop());
  };
  mediaRecorder.start(); btn.dataset.active = "true"; btn.textContent = "⏹️ Stop and Save";
}

  canvas.innerHTML = ""; new QRCode(canvas, { text: link, width: 160, height: 160 });

function renderBackupPolice() { document.getElementById("policeList").innerHTML = backupPolice.map(p => `<div class="police-item"><span>${p.name}</span><a href="tel:${p.phone}">Call</a></div>`).join(""); }
async function loadContacts() {
  supabaseClient.from("contacts").select("*").eq("user_id", currentUser.id).then(({data}) => {
    const list = document.getElementById("contactList"); list.innerHTML = "";
    if (data) data.forEach(c => {
      const div = document.createElement("div"); div.className="contact-item";
      div.innerHTML = `<span>${c.name} (${c.phone})</span><button class="del-btn" onclick="deleteContact('${c.id}')">✕</button>`;
      list.appendChild(div);
    });
  });
}
function addContact() {
  const n = document.getElementById("contactName").value, p = document.getElementById("contactPhone").value;
  supabaseClient.from("contacts").insert([{name: n, phone: p, user_id: currentUser.id}]).then(loadContacts);
}
function deleteContact(id) { supabaseClient.from("contacts").delete().eq("id", id).then(loadContacts); }
function handleLogout() { supabaseClient.auth.signOut(); location.reload(); }
function imSafe() { alert("Safe status sent to family."); }
function toggleJourneyMode() { document.getElementById("journeyStatusBox").style.display = "block"; document.getElementById("journeyStatusBox").textContent = "Monitoring Active..."; }

  document.getElementById("incidentDashboard").innerHTML = data.map(l => `<div class="police-item"><span>SOS: ${new Date(l.created_at).toLocaleDateString()}</span><a href="https://maps.google.com/?q=${l.latitude},${l.longitude}" target="_blank">Map</a></div>`).join("");
}

window.onload = () => {
  supabaseClient.auth.getSession().then(({data}) => { if (data.session) onAuthSuccess(data.session.user); else setLanguage(currentLang); });
};
