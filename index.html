<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PocketGuardian AI Pro - Tactical Command</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root { --bg: #050507; --panel: #11111a; --red: #ff3b5c; --green: #34c759; --blue: #3b82f6; --orange: #f59e0b; --purple: #a855f7; --wa: #075e54; }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: #f1f1f1; font-family: 'Segoe UI', sans-serif; min-height: 100vh; overflow-x: hidden; }
  
  .dashboard-container { display: none; grid-template-columns: 220px 1fr; min-height: 100vh; }
  .sidebar { background: #000; padding: 20px; border-right: 1px solid #222; display: flex; flex-direction: column; align-items: center; border-left: 5px solid var(--red); text-align: center; }
  .main-grid { padding: 15px; display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 12px; }

  .sos-wrap { position: relative; width: 140px; height: 140px; display: flex; align-items: center; justify-content: center; margin: 15px auto; }
  .sos-btn { width: 110px; height: 110px; border-radius: 50%; background: radial-gradient(circle, #ff3b5c, #8b0000); border: 4px solid #000; color: white; font-size: 28px; font-weight: 900; z-index: 10; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
  .sos-wrap::before, .sos-wrap::after { content: ""; position: absolute; width: 110px; height: 110px; border-radius: 50%; border: 2px solid var(--red); animation: pulse 2s linear infinite; opacity: 0; z-index: 1; }
  @keyframes pulse { 0% { transform: scale(1); opacity: 0.8; } 100% { transform: scale(2.4); opacity: 0; } }
  .sos-wrap.active::before { animation: pulse 0.5s linear infinite; border-color: white; }

  .col { background: var(--panel); border-radius: 16px; padding: 15px; border: 1px solid #222; }
  .col h3 { font-size: 11px; margin-bottom: 12px; color: var(--red); border-bottom: 1px solid #333; padding-bottom: 8px; text-transform: uppercase; }
  .btn { width: 100%; padding: 12px; border: none; border-radius: 10px; color: white; font-weight: bold; cursor: pointer; margin-bottom: 10px; font-size: 12px; transition: 0.2s; }
  
  .full-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 2000000; flex-direction: column; }
  #authScreen { position: fixed; top:0; left:0; width:100%; height:100%; background:var(--bg); z-index:999999; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; }
  #whatsappGhost { background: var(--wa); }
  
  #checkinBanner { display: none; position: fixed; top: 0; left: 0; width: 100%; background: var(--red); color: white; padding: 20px; text-align: center; z-index: 100000; font-weight: bold; }
  #routeMap { height: 200px; width: 100%; border-radius: 12px; margin-top: 10px; display: none; }

  @media (max-width: 900px) { .dashboard-container { grid-template-columns: 1fr; } .sidebar { flex-direction: row; height: auto; border-bottom: 3px solid var(--red); justify-content: space-between; } .sos-wrap { width: 80px; height: 80px; margin: 0; } .sos-btn { width: 60px; height: 60px; font-size: 16px; } }
</style>
</head>
<body>

<!-- WHATSAPP GHOST -->
<div id="whatsappGhost" class="full-overlay" onclick="exitGhost()">
    <div style="background:var(--wa); color:white; padding:15px; display:flex; align-items:center; gap:12px;">
        <div style="width:35px; height:35px; background:#ccc; border-radius:50%;"></div><span>Mom ❤️</span>
    </div>
    <div style="flex:1; background:#e5ddd5; padding:15px; color:black;">
        <div style="background:white; padding:8px; border-radius:8px; margin-bottom:10px; max-width:80%;">Ghar kab tak aaogi?</div>
        <div style="background:#dcf8c6; padding:8px; border-radius:8px; align-self:flex-end; margin-bottom:10px; max-width:80%; color:black; margin-left:auto;">Bas 5 min me...</div>
    </div>
</div>

<!-- AUTO CHECK-IN -->
<div id="checkinBanner">
    🚨 ANOMALY DETECTED! SOS IN <span id="checkinCountdown">30</span>s
    <button style="background:var(--green); color:white; border:none; padding:10px 20px; border-radius:5px; margin-top:10px; font-weight:bold;" onclick="confirmSafe()">✅ I AM SAFE</button>
</div>

<!-- AUTH SCREEN -->
<div id="authScreen">
    <h1 style="color:var(--red); font-size:32px; font-weight:900; margin-bottom: 20px;">POCKET GUARDIAN</h1>
    <div class="col" style="width:100%; max-width:350px;">
        <input type="email" id="authEmail" placeholder="Email Address">
        <input type="password" id="authPassword" placeholder="Password">
        <button class="btn" style="background:var(--red); padding:15px;" onclick="handleAuthSubmit()" id="authBtn">Enter Dashboard</button>
        <div id="authError" style="color:var(--red); font-size:11px; text-align:center; margin-top:10px;"></div>
    </div>
</div>

<div class="dashboard-container" id="dashContainer">
  <div class="sidebar">
    <div style="color:var(--red); font-weight: 900; font-size: 20px;">PG AI</div>
    <div class="sos-wrap" id="radarWrap"><button class="sos-btn" id="sosBtn" onclick="startSOSCountdown()">SOS</button></div>
    <div id="status" style="font-size:10px; color:var(--green); font-weight:bold;">SHIELD: ARMED</div>
    
    <select id="langSelector" onchange="setLanguage(this.value)" style="margin-top:auto; width:100%; padding:8px; background:#111; color:white; border:1px solid #333; border-radius:5px;">
      <option value="en">English</option><option value="hi">हिंदी</option><option value="mr">मराठी</option>
    </select>
  </div>

  <div class="main-grid">
    <div class="col">
      <h3>📍 Routing</h3>
      <button class="btn" style="background:var(--green);" onclick="findHelpRoute('police')">Find Police</button>
      <button class="btn" style="background:#0891b2;" onclick="findHelpRoute('hospital')">Find Hospital</button>
      <div id="routeMap"></div>
    </div>

    <div class="col">
      <h3>⚙️ AI Sensors</h3>
      <button class="btn" style="background:#059669;" id="btBtn" onclick="connectWearable()">⌚ Pair Smartwatch</button>
      <button class="btn" style="background:var(--red);" id="aiBtn" onclick="toggleThreat()">AI Anomaly Engine: OFF</button>
      <button class="btn" style="background:#ec4899;" id="voiceBtn" onclick="toggleVoice()">Voice SOS Trigger: OFF</button>
    </div>

    <div class="col">
      <h3>🎭 Stealth</h3>
      <button class="btn" style="background:var(--wa);" onclick="enterGhost('wa')">WhatsApp Ghost</button>
      <button class="btn" style="background:#333;" onclick="enterGhost('dead')">Update Ghost</button>
      <button class="btn" style="background:#0ea5e9;" id="jBtn" onclick="toggleJourney()">Journey Monitoring: OFF</button>
    </div>

    <div class="col">
      <h3>🚨 Authority Feed</h3>
      <div id="icccFeed" style="overflow-y:auto; max-height:300px;"></div>
    </div>

    <div class="col">
      <h3>👥 Contacts</h3>
      <div id="contactList"></div>
      <button class="btn" style="background:var(--red); margin-top:auto;" onclick="handleLogout()">Logout</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://xccnzedcdeecfmhxiwxs.supabase.co";
const SUPABASE_KEY = "sb_publishable_Rj_HX1xUGpa-tzhsIPWeqw_6IZx0fEy";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null, mapObj = null, aiActive = false, voiceActive = false, journeyActive = false;

// --- AUTH ---
async function handleAuthSubmit() {
    const e = document.getElementById("authEmail").value, p = document.getElementById("authPassword").value;
    const { data, error } = await supabaseClient.auth.signInWithPassword({ email: e, password: p });
    if (!error) loginSuccess(data.user);
    else { const { error: sErr } = await supabaseClient.auth.signUp({ email: e, password: p }); if (!sErr) alert("Verify email!"); }
}
function loginSuccess(user) { currentUser = user; document.getElementById("authScreen").style.display = "none"; document.getElementById("dashContainer").style.display = "grid"; loadICCC(); }

// --- AI ANOMALY ENGINE (PERMISSION FIXED) ---
async function toggleThreat() {
    const btn = document.getElementById("aiBtn");
    if (!aiActive) {
        if (typeof DeviceMotionEvent.requestPermission === 'function') {
            const permission = await DeviceMotionEvent.requestPermission();
            if (permission !== 'granted') return alert("Motion permission denied.");
        }
        window.addEventListener('devicemotion', handleMotion);
        aiActive = true; btn.textContent = "AI Anomaly Engine: ON"; btn.style.background = "var(--green)";
    } else {
        window.removeEventListener('devicemotion', handleMotion);
        aiActive = false; btn.textContent = "AI Anomaly Engine: OFF"; btn.style.background = "var(--red)";
    }
}
function handleMotion(e) { if(Math.abs(e.acceleration.x) > 35) triggerCheckin(); }

// --- VOICE SOS (PERMISSION FIXED) ---
let recognition;
function toggleVoice() {
    const btn = document.getElementById("voiceBtn");
    const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!Speech) return alert("Voice recognition not supported.");

    if (!voiceActive) {
        recognition = new Speech();
        recognition.continuous = true;
        recognition.lang = 'en-IN';
        recognition.onresult = (e) => {
            const transcript = e.results[e.results.length - 1][0].transcript.toLowerCase();
            if (transcript.includes("help") || transcript.includes("bachao")) startSOSCountdown();
        };
        recognition.start();
        voiceActive = true; btn.textContent = "Voice SOS Trigger: ON"; btn.style.background = "var(--green)";
    } else {
        recognition.stop();
        voiceActive = false; btn.textContent = "Voice SOS Trigger: OFF"; btn.style.background = "#ec4899";
    }
}

// --- BLUETOOTH WEARABLE ---
async function connectWearable() {
    try {
        const device = await navigator.bluetooth.requestDevice({ acceptAllDevices: true });
        alert("Connected to: " + device.name);
        document.getElementById("btBtn").style.background = "var(--blue)";
    } catch (e) { alert("Bluetooth Error: " + e.message); }
}

// --- JOURNEY MONITORING ---
function toggleJourney() {
    const btn = document.getElementById("jBtn");
    journeyActive = !journeyActive;
    btn.textContent = journeyActive ? "Journey Monitoring: ON" : "Journey Monitoring: OFF";
    btn.style.background = journeyActive ? "var(--green)" : "#0ea5e9";
    if(journeyActive) alert("AI monitoring route for deviations...");
}

// --- SOS ENGINE ---
function startSOSCountdown() {
    let c = 3; const b = document.getElementById("sosBtn");
    document.getElementById("radarWrap").classList.add("active");
    const t = setInterval(() => {
        b.textContent = c; c--;
        if(c < 0) { clearInterval(t); b.textContent = "SOS"; document.getElementById("radarWrap").classList.remove("active"); executeSOS(); }
    }, 1000);
}
async function executeSOS() {
    navigator.geolocation.getCurrentPosition(async (pos) => {
        await supabaseClient.from("sos_logs").insert([{latitude: pos.coords.latitude, longitude: pos.coords.longitude, user_id: currentUser.id, status:'verified'}]);
        alert("SOS BROADCASTED TO ICCC!"); loadICCC();
    });
}

function triggerCheckin() { document.getElementById("checkinBanner").style.display = "block"; }
function confirmSafe() { document.getElementById("checkinBanner").style.display = "none"; }
function enterGhost(m) { if(m === 'wa') document.getElementById("whatsappGhost").style.display="flex"; executeSOS(); }
function exitGhost() { document.getElementById("whatsappGhost").style.display="none"; }
function handleLogout() { location.reload(); }

async function loadICCC() {
    const { data } = await supabaseClient.from("sos_logs").select("*").eq("user_id", currentUser.id).order('created_at',{ascending:false});
    document.getElementById("icccFeed").innerHTML = data.map(l => `<div style="background:#000; padding:10px; border-radius:10px; margin-bottom:10px; border-left:4px solid var(--red); font-size:11px;">ALERT: ${new Date(l.created_at).toLocaleTimeString()}<br><a href="https://maps.google.com/?q=${l.latitude},${l.longitude}" target="_blank" style="color:var(--blue);">View Map</a></div>`).join("");
}

window.onload = () => {
    supabaseClient.auth.getSession().then(({data}) => { if (data.session) loginSuccess(data.session.user); });
};
</script>
</body>
</html>
