<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PocketGuardian AI Pro - Fail-Safe Safety</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root { --bg: #050507; --panel: #11111a; --red: #ff3b5c; --green: #34c759; --blue: #3b82f6; --orange: #f59e0b; --purple: #a855f7; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: #f1f1f1; font-family: 'Inter', 'Segoe UI', sans-serif; min-height: 100vh; overflow-x: hidden; }
  
  .dashboard { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
  .sidebar { background: #000; padding: 25px; border-right: 1px solid #222; display: flex; flex-direction: column; align-items: center; border-left: 5px solid var(--red); }
  .main-grid { padding: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 15px; }

  .logo-text { color: var(--red); font-weight: 900; letter-spacing: 2px; margin-bottom: 30px; text-align: center; font-size: 18px; }
  .sos-btn { width: 140px; height: 140px; border-radius: 50%; background: radial-gradient(circle, #ff3b5c, #8b0000); border: 4px solid #000; color: white; font-size: 36px; font-weight: 900; box-shadow: 0 0 40px rgba(255,59,92,0.4); cursor: pointer; transition: 0.3s; }
  
  .col { background: var(--panel); border-radius: 16px; padding: 18px; border: 1px solid #222; display: flex; flex-direction: column; }
  .col h3 { font-size: 12px; margin-bottom: 15px; color: var(--red); border-bottom: 1px solid #333; padding-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }

  .btn { width: 100%; padding: 12px; border: none; border-radius: 10px; color: white; font-weight: bold; cursor: pointer; margin-bottom: 10px; font-size: 12px; transition: 0.2s; }
  input { width: 100%; padding: 12px; background: #000; border: 1px solid #333; border-radius: 8px; color: white; margin-bottom: 10px; font-size: 13px; }

  #routeMap { height: 240px; width: 100%; border-radius: 12px; margin-top: 10px; display: none; border: 1px solid #333; }
  .overlay-screen { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 999999; flex-direction: column; align-items: center; justify-content: center; }
  #ghostScreen { background: #000; cursor: none; }
  #checkinBanner { display: none; position: fixed; top: 0; left: 0; width: 100%; background: var(--red); color: white; padding: 20px; text-align: center; z-index: 100000; font-weight: bold; }

  @media (max-width: 900px) { .dashboard { grid-template-columns: 1fr; } .sidebar { flex-direction: row; height: auto; border-left: none; border-bottom: 4px solid var(--red); } }
</style>
</head>
<body>

<div id="checkinBanner">
    🚨 ANOMALY DETECTED: ARE YOU SAFE? <br>
    AUTHORITY NOTIFIED IN <span id="checkinCountdown">30</span>s
    <button class="btn" style="background:var(--green); width:150px; margin-top:10px; border: 2px solid white;" onclick="confirmSafe()">✅ I AM SAFE</button>
</div>

<div class="dashboard">
  <div class="sidebar">
    <div class="logo-text">POCKET<br>GUARDIAN</div>
    <button class="sos-btn" id="sosBtn" onclick="startSOSCountdown()">SOS</button>
    <div id="status" style="margin-top:20px; font-size:12px; color:var(--green); font-weight:bold;">SHIELD: ACTIVE</div>
    
    <select id="langSelector" onchange="setLanguage(this.value)" style="margin-top:auto; width:100%; padding:10px; background:#111; color:white; border:1px solid #333; border-radius:5px;">
      <option value="en">English</option><option value="hi">हिंदी</option><option value="mr">मराठी</option>
    </select>
    <button onclick="handleLogout()" style="background:none; border:none; color:#444; font-size:11px; margin-top:15px; cursor:pointer;">End Session</button>
  </div>

  <div class="main-grid" id="mainDashboard" style="display:none;">
    
    <!-- COL 1: TACTICAL NAVIGATION (FAIL-SAFE) -->
    <div class="col">
      <h3 style="color:var(--green);">📍 Tactical Safety Routing</h3>
      <button class="btn" style="background:var(--green);" onclick="findHelpRoute('police')">Find Police (Live + Backup)</button>
      <button class="btn" style="background:#0891b2;" onclick="findHelpRoute('hospital')">Find Hospital (Live + Backup)</button>
      <button class="btn" style="background:var(--purple);" onclick="lockCurrentTransit()">🔒 Lock Transit Route</button>
      <div id="routeMap"></div>
      <div id="routeInfo" style="margin-top:10px; font-size:11px; text-align:center; color:var(--green);">Ready for secure routing...</div>
    </div>

    <!-- COL 2: SENSORS & STEALTH -->
    <div class="col">
      <h3 style="color:var(--purple);">⚙️ AI Sensors & Stealth</h3>
      <button class="btn" style="background:#222;" onclick="enterGhostMode()">👻 Enter Ghost Mode</button>
      <button class="btn" style="background:var(--purple);" id="shakeBtn" onclick="toggleShake()">Shake SOS: <b id="shakeState">OFF</b></button>
      <button class="btn" style="background:var(--red);" id="aiBtn" onclick="toggleAI()">Anomaly Engine: <b id="aiState">OFF</b></button>
      <button class="btn" style="background:#ec4899;" id="voiceBtn" onclick="toggleVoice()">Voice SOS: <b id="voiceState">OFF</b></button>
    </div>

    <!-- COL 3: JOURNEY & EVIDENCE -->
    <div class="col">
      <h3 style="color:var(--blue);">🚶 Journey & Evidence</h3>
      <button class="btn" style="background:#0ea5e9;" id="jBtn" onclick="toggleJourney()">Journey Monitor: <b id="jState">OFF</b></button>
      <button class="btn" style="background:var(--orange);" onclick="captureEvidence()">Silent Record Evidence</button>
      <button class="btn" style="background:var(--blue);" onclick="toggleQR()">Live Track & QR Code</button>
      <div id="qrBox" style="display:none; background:white; padding:10px; border-radius:8px; margin-top:10px; text-align:center;"><div id="qrCanvas" style="display:inline-block;"></div></div>
      <video id="vidPrev" autoplay muted playsinline style="display:none; width:100%; border-radius:12px; margin-top:10px; background:#000;"></video>
    </div>

    <!-- COL 4: AUTHORITY FEED (ICCC) -->
    <div class="col" style="background: #090910;">
      <h3 style="color:var(--orange);">🚨 Authority Tactical Feed</h3>
      <div id="icccFeed" style="overflow-y:auto; max-height:450px;">
        <p style="font-size:11px; color:#555; text-align:center;">Monitoring Local Safety Channels...</p>
      </div>
    </div>

    <!-- COL 5: TRUSTED NETWORK -->
    <div class="col">
      <h3 style="color:var(--red);">👥 Trusted Network</h3>
      <input type="text" id="cn" placeholder="Contact Name">
      <input type="tel" id="cp" placeholder="91XXXXXXXXXX">
      <button class="btn" style="background:var(--red)" onclick="saveContact()">+ Add Trusted Member</button>
      <div id="contactList" style="margin-top:10px;"></div>
    </div>

  </div>
</div>

<div id="authScreen" style="position:fixed; top:0; left:0; width:100%; height:100%; background:var(--bg); z-index:999999; display:flex; flex-direction:column; align-items:center; justify-content:center;">
    <h1 style="color:var(--red); font-size:32px; font-weight:900;">POCKET GUARDIAN</h1>
    <div class="col" style="width:90%; max-width:350px; background:#111;">
        <input type="email" id="authEmail" placeholder="Email Address">
        <input type="password" id="authPassword" placeholder="Access Password">
        <button class="btn" style="background:var(--red); padding:15px;" onclick="handleAuth()">INITIALIZE PROTECTION</button>
        <div id="authError" style="color:var(--red); font-size:11px; text-align:center;"></div>
    </div>
</div>

<script>
const SUPABASE_URL = "https://xccnzedcdeecfmhxiwxs.supabase.co";
const SUPABASE_KEY = "sb_publishable_Rj_HX1xUGpa-tzhsIPWeqw_6IZx0fEy";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;
let mapObj = null;
let shakeActive = false;

// --- OFFLINE BACKUP DATABASES (SATARA + PUNE) ---
const BACKUP_POLICE_DB = [
  { name: "Satara City Police", lat: 17.6917, lng: 73.9950, phone: "02162230580" },
  { name: "Shahupuri Police", lat: 17.6744, lng: 74.0084, phone: "02162252333" },
  { name: "Satara Taluka Police", lat: 17.7011, lng: 73.9930, phone: "02162233949" },
  { name: "Wakad Police", lat: 18.5982, lng: 73.7661, phone: "02022934100" },
  { name: "Hinjewadi Police", lat: 18.5913, lng: 73.7389, phone: "02022934622" },
  { name: "Shivajinagar Police", lat: 18.5314, lng: 73.8444, phone: "02025536263" }
];

const BACKUP_HOSPITAL_DB = [
  // Satara Hospitals
  { name: "Satara Hospital & Research Center", lat: 17.693, lng: 73.998, phone: "02162228288" },
  { name: "Girija Multispeciality Hospital", lat: 17.689, lng: 73.993, phone: "7020122975" },
  { name: "Shwas Multispeciality Hospital", lat: 17.694, lng: 73.999, phone: "8446328200" },
  { name: "Ajinkyatara Hospital", lat: 17.692, lng: 73.997, phone: "02162239027" },
  { name: "Balaji Shriratna Hospital", lat: 17.675, lng: 74.008, phone: "7219479090" },
  { name: "Yashwant Hospital", lat: 17.688, lng: 73.992, phone: "9373763871" },
  // Pune Hospitals
  { name: "Bharati Hospital Pune", lat: 18.457, lng: 73.854, phone: "02040555555" },
  { name: "Sai Sneh Hospital", lat: 18.451, lng: 73.858, phone: "8888150101" },
  { name: "Siddhi Hospital", lat: 18.459, lng: 73.852, phone: "7447434524" },
  { name: "Vighnaharata Hospital", lat: 18.468, lng: 73.865, phone: "9921884422" }
];

function getDist(lat1, lon1, lat2, lon2) {
    const R = 6371; const dLat = (lat2-lat1)*Math.PI/180; const dLon = (lon2-lon1)*Math.PI/180;
    const a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

async function findHelpRoute(type) {
    const info = document.getElementById("routeInfo");
    info.textContent = "Syncing Local Databases...";
    
    navigator.geolocation.getCurrentPosition(async (pos) => {
        const uLat = pos.coords.latitude, uLng = pos.coords.longitude;
        let dest = null;

        // 1. Try Live Overpass API
        if (navigator.onLine) {
            try {
                const res = await fetch(`https://overpass-api.de/api/interpreter?data=[out:json];node(around:5000,${uLat},${uLng})[amenity~"${type}"];out;`);
                const data = await res.json();
                if (data.elements.length > 0) {
                    dest = { lat: data.elements[0].lat, lng: data.elements[0].lon, name: data.elements[0].tags.name };
                    info.textContent = "Live Result: " + dest.name;
                }
            } catch (e) {}
        }

        // 2. Offline Backup Failover
        if (!dest) {
            const db = (type === 'police') ? BACKUP_POLICE_DB : BACKUP_HOSPITAL_DB;
            let minD = Infinity;
            db.forEach(item => {
                const d = getDist(uLat, uLng, item.lat, item.lng);
                if (d < minD) { minD = d; dest = item; }
            });
            info.innerHTML = `📡 OFFLINE BACKUP ACTIVE <br> Nearest: <b>${dest.name}</b> (~${minD.toFixed(1)}km)`;
        }

        // Render Map
        document.getElementById("routeMap").style.display = "block";
        if (mapObj) mapObj.remove();
        mapObj = L.map('routeMap').setView([uLat, uLng], 14);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapObj);
        L.marker([uLat, uLng]).addTo(mapObj);
        L.marker([dest.lat, dest.lng]).addTo(mapObj).bindPopup(dest.name).openPopup();
        L.polyline([[uLat, uLng], [dest.lat, dest.lng]], {color: 'red', weight: 6, dashArray: '10,10'}).addTo(mapObj);
    });
}

// --- CORE UTILS (AUTH, SOS, SHAKE) ---
async function handleAuth() {
    const e = document.getElementById("authEmail").value, p = document.getElementById("authPassword").value;
    const { data, error } = await supabaseClient.auth.signInWithPassword({ email: e, password: p });
    if (!error) { currentUser = data.user; document.getElementById("authScreen").style.display = "none"; document.getElementById("mainDashboard").style.display = "grid"; }
}

function startSOSCountdown() {
    let c = 3; const b = document.getElementById("sosBtn");
    setInterval(() => { b.textContent = c; c--; if(c < 0) location.reload(); }, 1000);
}

function toggleShake() {
    shakeActive = !shakeActive;
    document.getElementById("shakeState").textContent = shakeActive ? "ON" : "OFF";
    document.getElementById("shakeBtn").style.background = shakeActive ? "var(--green)" : "var(--purple)";
}

function handleLogout() { location.reload(); }
window.onload = () => { supabaseClient.auth.getSession().then(({data}) => { if (data.session) { currentUser = data.session.user; document.getElementById("authScreen").style.display = "none"; document.getElementById("mainDashboard").style.display = "grid"; } }); };
</script>
</body>
</html>
