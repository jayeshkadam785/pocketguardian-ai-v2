<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PocketGuardian AI</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#c0154a">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0a0a0f; color: #f1f1f1; font-family: 'Segoe UI', sans-serif;
    min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px;
  }
  h1 { color: #ff3b5c; margin: 20px 0 5px; font-size: 28px; }
  .subtitle { color: #999; font-size: 13px; margin-bottom: 25px; text-align: center; }
  .sos-btn {
    width: 180px; height: 180px; border-radius: 50%;
    background: radial-gradient(circle, #ff3b5c, #b8002e);
    border: none; color: white; font-size: 28px; font-weight: bold;
    box-shadow: 0 0 30px rgba(255,59,92,0.6); cursor: pointer; transition: transform 0.15s;
  }
  .sos-btn:active { transform: scale(0.95); }
  .status { margin-top: 20px; font-size: 14px; color: #4ade80; min-height: 20px; text-align: center; }
  .section { width: 100%; max-width: 420px; background: #16161f; border-radius: 14px; padding: 18px; margin-top: 25px; }
  .section h3 { font-size: 15px; color: #ff3b5c; margin-bottom: 12px; }
  input { width: 100%; padding: 10px; margin-bottom: 8px; border-radius: 8px; border: 1px solid #333; background: #0a0a0f; color: white; font-size: 14px; }
  .add-btn { width: 100%; padding: 10px; background: #ff3b5c; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; margin-top: 5px; }
  .contact-item { display: flex; justify-content: space-between; align-items: center; background: #0a0a0f; padding: 10px 12px; border-radius: 8px; margin-bottom: 8px; font-size: 14px; }
  .del-btn { background: none; border: none; color: #ff3b5c; cursor: pointer; font-size: 16px; }
  .fake-call-btn { width: 100%; padding: 12px; background: #333; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; margin-top: 10px; }
  .lang-selector { position: fixed; top: 14px; right: 14px; background: #16161f; color: white; border: 1px solid #333; border-radius: 8px; padding: 6px 8px; font-size: 13px; z-index: 10001; }
  .fake-call-screen { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(180deg, #1a2a3a, #0a0a0f 60%); z-index: 99999; flex-direction: column; justify-content: space-between; align-items: center; padding: 60px 20px 50px; animation: fadeIn 0.3s ease; }
  .caller-avatar { width: 110px; height: 110px; border-radius: 50%; background: #2a2a3a; display: flex; align-items: center; justify-content: center; font-size: 50px; margin-bottom: 20px; animation: pulse 1.5s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255,255,255,0.15); } 70% { box-shadow: 0 0 0 25px rgba(255,255,255,0); } 100% { box-shadow: 0 0 0 0 rgba(255,255,255,0); } }
  .call-action-btn { width: 65px; height: 65px; border-radius: 50%; border: none; font-size: 26px; cursor: pointer; color: white; }
  .call-action-btn.decline { background: #ff3b30; transform: rotate(135deg); }
  .call-action-btn.accept { background: #34c759; }
  #mainAppScreen { display: none; flex-direction: column; align-items: center; width: 100%; }
  #checkinBanner { display: none; position: fixed; top: 0; left: 0; width: 100%; background: #b8002e; color: white; padding: 16px 20px; text-align: center; z-index: 100000; font-size: 15px; }
  #routeMapContainer { display: none; height: 250px; border-radius: 10px; overflow: hidden; margin-top: 10px; width: 100%; }
  #journeyStatusBox { display: none; background: #0a0a0f; border: 1px solid #3b82f6; border-radius: 10px; padding: 12px; margin-top: 10px; font-size: 13px; color: #93c5fd; }
</style>
</head>
<body>

<div id="checkinBanner">
  <div id="checkinText">Are you okay? Auto-alert in <span id="checkinCountdown">30</span>s</div>
  <button style="background:#34c759; color:white; padding: 8px 16px; border:none; border-radius:5px; margin-top:10px; font-weight:bold;" onclick="confirmSafeCheckin()">✅ I'm Fine</button>
</div>

<!-- AUTH SCREEN -->
<div id="authScreen" style="width:100%; max-width:420px; padding-top:60px; display:flex; flex-direction:column; align-items:center;">
  <h1>🛡️ PocketGuardian AI</h1>
  <div class="subtitle">Sign in to access your safety dashboard</div>
  <div class="section" style="width:100%;">
    <h3 id="authFormTitle">Login</h3>
    <input type="email" id="authEmail" placeholder="Email">
    <input type="password" id="authPassword" placeholder="Password">
    <div id="termsCheckWrap" style="display:none; align-items:center; gap:8px; margin:10px 0; font-size:12px; color:#999;">
      <input type="checkbox" id="agreeTerms">
      <label for="agreeTerms">I agree to the <a href="#" onclick="openLegalScreen(); return false;" style="color:#4ade80;">Terms & Policy</a></label>
    </div>
    <button class="add-btn" onclick="handleAuthSubmit()" id="authSubmitBtn">Login</button>
    <div id="authError" style="color:#ff6b6b; font-size:13px; margin-top:8px; text-align:center;"></div>
    <div style="text-align:center; margin-top:14px; font-size:13px; color:#999;">
      <span id="authToggleText">Don't have an account?</span>
      <a href="#" onclick="toggleAuthMode(); return false;" style="color:#4ade80; font-weight:bold;" id="authToggleLink">Sign Up</a>
    </div>
  </div>
</div>

<!-- MAIN APP -->
<div id="mainAppScreen">
<select class="lang-selector" id="langSelector" onchange="setLanguage(this.value)">
  <option value="en">English</option><option value="hi">हिंदी</option><option value="mr">मराठी</option>
  <option value="gu">ગુજરાતી</option><option value="ur">اردو</option><option value="bn">বাংলা</option>
  <option value="ta">தமிழ்</option><option value="te">తెలుగు</option><option value="kn">ಕನ್ನಡ</option>
</select>
<button onclick="handleLogout()" style="position:fixed; top:14px; left:14px; background:#16161f; color:#ff6b6b; border:1px solid #333; border-radius:8px; padding:6px 12px; font-size:12px; z-index:10001;">Logout</button>

<h1>🛡️ <span id="txt-title">PocketGuardian AI</span></h1>
<div class="subtitle" id="txt-subtitle">SOS Safety — Tap the button in an emergency</div>

<button class="sos-btn" id="sosBtn" onclick="startSOSCountdown()">SOS</button>
<div class="status" id="status"></div>
<button id="cancelSosBtn" onclick="cancelSOSCountdown()" style="display:none; margin-top:10px; padding:10px 20px; background:#333; border:none; border-radius:8px; color:white; font-weight:bold; cursor:pointer;">Cancel</button>

<button class="fake-call-btn" onclick="fakeCall()">📞 <span id="txt-fakecall">Emergency Call</span></button>

<div class="section">
  <h3 id="txt-contacts-h">Emergency Contacts</h3>
  <input type="text" id="contactName" placeholder="Name">
  <input type="tel" id="contactPhone" placeholder="Phone (91XXXXXXXXXX)">
  <button class="add-btn" onclick="addContact()" id="txt-addbtn">+ Add Contact</button>
  <div id="contactList" style="margin-top:12px;"></div>
</div>

<div class="section" id="safetyToolsSection">
  <h3>🛠️ Safety Tools & AI</h3>
  <button class="add-btn" style="background:#34c759; margin-bottom:10px;" onclick="imSafe()">✅ I'm Safe</button>
  <button class="add-btn" style="background:#3b82f6; margin-bottom:10px;" onclick="toggleLiveShare()" id="liveShareBtn">📍 Share Live Location & QR</button>
  <div id="liveShareInfo" style="margin-bottom:10px; font-size:12px; color:#4ade80; word-break:break-all;"></div>
  <div id="qrCodeBox" style="display:none; background:white; padding:10px; border-radius:10px; margin-bottom:10px; text-align:center;">
    <div id="qrCodeCanvas"></div>
  </div>

  <button class="add-btn" style="background:#ff9d4d; margin-bottom:10px;" onclick="toggleRecording()" id="recordBtn">🎥 Record Video & Audio Evidence</button>
  <div id="recordingInfo" style="font-size:12px; color:#ff9d4d;"></div>
  <video id="evidencePreview" autoplay muted playsinline style="display:none; width:100%; border-radius:10px; margin-top:10px; background:#000;"></video>

  <button class="add-btn" style="background:#ec4899; margin-top:10px;" onclick="toggleVoiceSOS()" id="voiceSosBtn">🎤 Enable Voice SOS (Trigger: Help)</button>
  <button class="add-btn" style="background:#dc2626; margin-top:10px;" onclick="toggleThreatDetection()" id="threatDetectBtn">🛡️ Enable AI Threat Detection</button>
  <div id="threatDetectInfo" style="margin-top:8px; font-size:12px; color:#fca5a5;"></div>

  <button class="add-btn" style="background:#0ea5e9; margin-top:10px;" onclick="toggleJourneyMode()" id="journeyBtn">🚶 Start Journey & Crowd Monitor</button>
  <div id="journeyStatusBox"></div>
  <div id="crowdLevelBox" style="margin-top:8px; font-size:12px; color:#94a3b8;"></div>

  <button class="add-btn" style="background:#14b8a6; margin-top:10px;" onclick="findNearestSafeLocation(false)">🧭 Nearest Police & Hospital</button>
  <div id="nearestSafeInfo" style="margin-top:8px; font-size:13px; color:#5eead4; text-align:center;"></div>
  <div id="safeLocationSuggestions"></div>
  <div id="routeMapContainer"></div>
  
  <button class="add-btn" style="background:#f59e0b; margin-top:10px;" onclick="toggleIncidentDashboard()">📋 My Incident Dashboard</button>
  <div id="incidentDashboard" style="display:none; margin-top:10px;"></div>
</div>

<!-- FAKE CALL SCREEN -->
<div id="fakeCallScreen" class="fake-call-screen">
  <div style="text-align:center; margin-top:40px;">
    <div class="caller-avatar">👤</div>
    <div style="font-size:28px; font-weight:600; color:white;">Family Member</div>
    <div id="callStatusText" style="color:#999;">Incoming call...</div>
  </div>
  <div style="display:flex; justify-content:space-around; width:100%;">
    <button class="call-action-btn decline" onclick="endFakeCall()">📞</button>
    <button class="call-action-btn accept" onclick="acceptFakeCall()">📞</button>
  </div>
</div>
</div>

<script>
// --- CONFIG ---
const SUPABASE_URL = "https://xccnzedcdeecfmhxiwxs.supabase.co";
const SUPABASE_KEY = "sb_publishable_Rj_HX1xUGpa-tzhsIPWeqw_6IZx0fEy";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;
let routeLeafletMap = null; // Map handle
let currentLang = "en";

// --- AUTH LOGIC ---
async function handleAuthSubmit() {
  const email = document.getElementById("authEmail").value.trim();
  const password = document.getElementById("authPassword").value;
  const errorBox = document.getElementById("authError");
  try {
    if (isSignupMode) {
      const { data, error } = await supabaseClient.auth.signUp({ email, password });
      if (error) throw error;
      errorBox.style.color = "#4ade80"; errorBox.textContent = "Success! Check email.";
    } else {
      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) throw error;
      onAuthSuccess(data.user);
    }
  } catch (e) { errorBox.textContent = e.message; }
}

function onAuthSuccess(user) {
  currentUser = user;
  document.getElementById("authScreen").style.display = "none";
  document.getElementById("mainAppScreen").style.display = "flex";
  loadContacts();
}

let isSignupMode = false;
function toggleAuthMode() {
  isSignupMode = !isSignupMode;
  document.getElementById("authFormTitle").textContent = isSignupMode ? "Sign Up" : "Login";
}

// --- SOS & SMS LOGIC ---
let sosTimer = null;
function startSOSCountdown() {
  let c = 3; const btn = document.getElementById("sosBtn");
  document.getElementById("cancelSosBtn").style.display = "block";
  sosTimer = setInterval(() => {
    btn.textContent = c; c--;
    if(c < 0) { clearInterval(sosTimer); btn.textContent = "SOS"; executeSOS(); }
  }, 1000);
}

function cancelSOSCountdown() { clearInterval(sosTimer); document.getElementById("sosBtn").textContent = "SOS"; document.getElementById("cancelSosBtn").style.display="none"; }

async function executeSOS() {
  navigator.geolocation.getCurrentPosition(async (pos) => {
    const lat = pos.coords.latitude, lng = pos.coords.longitude;
    const { data: contacts } = await supabaseClient.from("contacts").select("phone");
    if (!contacts || contacts.length === 0) return alert("Add contacts first!");
    
    const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
    const phones = contacts.map(c => c.phone).join(isIOS ? ";" : ",");
    const mapsLink = `https://maps.google.com/?q=${lat},${lng}`;
    const msg = encodeURIComponent("EMERGENCY! I need help. My location: " + mapsLink);
    window.location.href = `sms:${phones}${isIOS ? '&' : '?'}body=${msg}`;
    
    // Auto-save log to dashboard
    await supabaseClient.from("sos_logs").insert([{latitude: lat, longitude: lng, user_id: currentUser.id}]);
  });
}

// --- NAVIGATION & MAPS (FIXED) ---
async function findNearestSafeLocation() {
  const info = document.getElementById("nearestSafeInfo");
  info.textContent = "Locating nearest police/hospital...";
  navigator.geolocation.getCurrentPosition(async (pos) => {
    const lat = pos.coords.latitude, lon = pos.coords.longitude;
    const query = `[out:json];node(around:5000,${lat},${lon})[amenity~"police|hospital"];out;`;
    const res = await fetch(`https://overpass-api.de/api/interpreter?data=${encodeURIComponent(query)}`);
    const data = await res.json();
    
    if (data.elements.length > 0) {
      const s = data.elements[0];
      const mapContainer = document.getElementById("routeMapContainer");
      mapContainer.style.display = "block";
      
      if (routeLeafletMap) { routeLeafletMap.remove(); } // FIXED MAP CRASH
      routeLeafletMap = L.map(mapContainer).setView([lat, lon], 14);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(routeLeafletMap);
      L.marker([lat, lon]).addTo(routeLeafletMap);
      L.marker([s.lat, s.lon]).addTo(routeLeafletMap).bindPopup(s.tags.name || "Safe Point").openPopup();
      L.polyline([[lat, lon], [s.lat, s.lon]], {color: 'red'}).addTo(routeLeafletMap);
      info.textContent = "Found: " + (s.tags.name || "Nearby Safety Point");
    }
  });
}

// --- JOURNEY & CROWD MONITOR ---
let journeyActive = false;
function toggleJourneyMode() {
  journeyActive = !journeyActive;
  const box = document.getElementById("journeyStatusBox");
  const crowd = document.getElementById("crowdLevelBox");
  if (journeyActive) {
    box.style.display = "block";
    box.textContent = "🟢 Journey Monitoring Active. Checking for deviations...";
    const hour = new Date().getHours();
    crowd.textContent = (hour > 17 || hour < 9) ? "🔴 Estimated Crowd: Low/Quiet" : "🟡 Estimated Crowd: Moderate";
  } else {
    box.style.display = "none"; crowd.textContent = "";
  }
}

// --- VOICE SOS ---
let recognition;
function toggleVoiceSOS() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SpeechRecognition) return alert("Voice not supported");
  recognition = new SpeechRecognition();
  recognition.onresult = (e) => {
    if(e.results[0][0].transcript.toLowerCase().includes("help")) executeSOS();
  };
  recognition.start();
  alert("Listening for trigger word 'HELP'...");
}

// --- RECORDING ---
let recorder;
async function toggleRecording() {
  const stream = await navigator.mediaDevices.getUserMedia({video: true, audio: true});
  document.getElementById("evidencePreview").srcObject = stream;
  document.getElementById("evidencePreview").style.display = "block";
  recorder = new MediaRecorder(stream); recorder.start();
  document.getElementById("recordingInfo").textContent = "🔴 Recording Evidence...";
}

// --- CONTACTS ---
async function loadContacts() {
  const { data } = await supabaseClient.from("contacts").select("*").eq("user_id", currentUser.id);
  const list = document.getElementById("contactList"); list.innerHTML = "";
  if (data) data.forEach(c => {
    const div = document.createElement("div"); div.className="contact-item";
    div.innerHTML = `<span>${c.name} (${c.phone})</span><button class="del-btn" onclick="deleteContact('${c.id}')">✕</button>`;
    list.appendChild(div);
  });
}
async function addContact() {
  const n = document.getElementById("contactName").value, p = document.getElementById("contactPhone").value;
  await supabaseClient.from("contacts").insert([{name: n, phone: p, user_id: currentUser.id}]);
  loadContacts();
}
async function deleteContact(id) { await supabaseClient.from("contacts").delete().eq("id", id); loadContacts(); }

// --- FAKE CALL ---
function fakeCall() { document.getElementById("fakeCallScreen").style.display="flex"; }
function endFakeCall() { document.getElementById("fakeCallScreen").style.display="none"; }
function acceptFakeCall() { document.getElementById("callStatusText").textContent="00:01"; }

function handleLogout() { supabaseClient.auth.signOut(); location.reload(); }

window.onload = () => {
  supabaseClient.auth.getSession().then(({data}) => { if (data.session) onAuthSuccess(data.session.user); });
};
</script>
</body>
</html>
