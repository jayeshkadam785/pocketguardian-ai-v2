<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PocketGuardian AI Pro - Final Tactical</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root { --bg: #050507; --panel: #11111a; --red: #ff3b5c; --green: #34c759; --blue: #3b82f6; --orange: #f59e0b; --purple: #a855f7; --wa: #075e54; }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: #f1f1f1; font-family: 'Segoe UI', sans-serif; min-height: 100vh; overflow-x: hidden; }
  
  /* SOS LIVE ANIMATION */
  .sos-wrap { position: relative; width: 180px; height: 180px; display: flex; align-items: center; justify-content: center; margin: 20px 0; }
  
  .sos-btn { 
    width: 140px; height: 140px; border-radius: 50%; 
    background: radial-gradient(circle, #ff3b5c, #8b0000); 
    border: 4px solid #000; color: white; font-size: 32px; font-weight: 900; 
    position: relative; z-index: 10; cursor: pointer; transition: 0.3s;
    display: flex; align-items: center; justify-content: center;
  }

  /* Radar Rings Animation */
  .sos-wrap::before, .sos-wrap::after {
    content: ""; position: absolute; width: 140px; height: 140px;
    border-radius: 50%; border: 2px solid var(--red);
    animation: pulse 2s linear infinite; opacity: 0; z-index: 1;
  }
  .sos-wrap::after { animation-delay: 1s; }

  @keyframes pulse {
    0% { transform: scale(1); opacity: 0.8; }
    100% { transform: scale(1.8); opacity: 0; }
  }

  /* Rapid Animation when Countdown starts */
  .sos-wrap.active::before, .sos-wrap.active::after {
    animation: pulse 0.6s linear infinite;
    border-color: white;
  }
  .sos-wrap.active .sos-btn { background: #ff0000; transform: scale(0.95); box-shadow: 0 0 30px var(--red); }

  /* Layout & Cards */
  .dashboard-container { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
  .sidebar { background: #000; padding: 20px; border-right: 1px solid #222; display: flex; flex-direction: column; align-items: center; text-align: center; border-left: 5px solid var(--red); }
  .main-grid { padding: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; }
  .col { background: var(--panel); border-radius: 16px; padding: 18px; border: 1px solid #222; display: flex; flex-direction: column; }
  .col h3 { font-size: 12px; margin-bottom: 15px; color: var(--red); border-bottom: 1px solid #333; padding-bottom: 10px; text-transform: uppercase; }
  .btn { width: 100%; padding: 12px; border: none; border-radius: 10px; color: white; font-weight: bold; cursor: pointer; margin-bottom: 10px; font-size: 12px; }
  input { width: 100%; padding: 12px; background: #000; border: 1px solid #333; border-radius: 8px; color: white; margin-bottom: 10px; }

  /* Tactical Features */
  #routeMap { height: 240px; width: 100%; border-radius: 12px; margin-top: 10px; display: none; border: 1px solid #333; }
  .full-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1000000; flex-direction: column; }
  #historyOverlay { background: var(--bg); overflow-y: auto; padding: 25px; }

  /* Audio Visualizer */
  .audio-wave { display: flex; align-items: flex-end; gap: 2px; height: 20px; margin: 10px 0; }
  .audio-bar { width: 3px; background: var(--green); animation: wave 1s infinite; }
  @keyframes wave { 0%, 100% { height: 5px; } 50% { height: 20px; } }

  @media (max-width: 900px) { .dashboard-container { grid-template-columns: 1fr; } .sidebar { flex-direction: row; height: auto; border-left: none; border-bottom: 4px solid var(--red); justify-content: space-between; } .sos-wrap { width: 100px; height: 100px; } .sos-btn { width: 80px; height: 80px; font-size: 20px; } .sos-wrap::before, .sos-wrap::after { width: 80px; height: 80px; } }
</style>
</head>
<body>

<!-- GHOST MODE: WHATSAPP -->
<div id="whatsappGhost" class="full-overlay" onclick="exitGhost()">
    <div style="background:var(--wa); color:white; padding:15px; display:flex; align-items:center; gap:12px;">
        <div style="width:38px; height:38px; background:#ccc; border-radius:50%;"></div>
        <span style="font-size: 18px; font-weight: 500;">Mom ❤️</span>
    </div>
    <div style="flex: 1; background: #e5ddd5; padding: 15px;">
        <div style="background:white; padding:10px; border-radius:10px; margin-bottom:10px; max-width:80%; color:black;">Kahan ho beta? Der ho rahi hai.</div>
        <div style="background:#dcf8c6; padding:10px; border-radius:10px; align-self:flex-end; margin-bottom:10px; max-width:80%; color:black; margin-left:auto;">Bas 5 min me aa rahi hu, auto me hu.</div>
    </div>
</div>

<div id="blackGhost" class="full-overlay" onclick="exitGhost()">
    <div style="display:flex; height:100%; background:#000; justify-content:center; align-items:center; color:#1a1a1a;"><p>System Update: 14%...</p></div>
</div>

<!-- HISTORY OVERLAY -->
<div id="historyOverlay" class="full-overlay">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
        <h2 style="color:var(--red);">AUTHORITY LOGS</h2>
        <button onclick="closeHistory()" style="background:var(--red); border:none; color:white; padding:8px 15px; border-radius:5px;">CLOSE</button>
    </div>
    <div id="historyContent"></div>
</div>

<!-- AUTH SCREENS -->
<div id="authScreen" style="position:fixed; top:0; left:0; width:100%; height:100%; background:var(--bg); z-index:999999; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px;">
    <h1 style="color:var(--red); font-size:35px; font-weight:900; margin-bottom: 20px;">POCKET GUARDIAN</h1>
    <div class="col" style="width:100%; max-width:350px;">
        <input type="email" id="authEmail" placeholder="Email Address">
        <input type="password" id="authPassword" placeholder="Password">
        <button class="btn" style="background:var(--red); padding:15px;" onclick="handleAuthSubmit()">Enter Command Center</button>
        <div id="authError" style="color:var(--red); font-size:11px; text-align:center; margin-top:10px;"></div>
    </div>
</div>

<div class="dashboard-container">
  <!-- SIDEBAR -->
  <div class="sidebar">
    <div style="color:var(--red); font-weight: 900; font-size: 22px; margin-bottom: 10px;">PG AI</div>
    
    <div class="sos-wrap" id="sosAnimateWrap">
        <button class="sos-btn" id="sosBtn" onclick="startSOSCountdown()">SOS</button>
    </div>
    
    <div id="status" style="margin-top:10px; font-size:12px; color:var(--green); font-weight:bold;">SHIELD: ACTIVE</div>
    
    <select id="langSelector" onchange="setLanguage(this.value)" style="margin-top:auto; width:100%; padding:8px; background:#111; color:white; border:1px solid #333; border-radius:5px;">
      <option value="en">English</option><option value="hi">हिंदी</option><option value="mr">मराठी</option>
    </select>
    <button onclick="handleLogout()" style="background:none; border:none; color:#444; font-size:11px; margin-top:15px;">Logout</button>
  </div>

  <div class="main-grid" id="mainDashboard" style="display:none;">
    <!-- COL 1: NAVIGATION -->
    <div class="col">
      <h3 style="color:var(--green);">📍 Tactical Routing</h3>
      <button class="btn" style="background:var(--green);" onclick="findHelpRoute('police')">Find Police Station</button>
      <button class="btn" style="background:#0891b2;" onclick="findHelpRoute('hospital')">Find Hospital</button>
      <div id="routeMap"></div>
      <div id="safetyScore" style="margin-top:10px; font-size:11px; text-align:center; font-weight:bold;">Safety Score: 8.5/10</div>
    </div>

    <!-- COL 2: AI SENSORS -->
    <div class="col">
      <h3 style="color:var(--purple);">⚙️ AI Sensors & Voice</h3>
      <button class="btn" style="background:var(--red);" id="aiBtn" onclick="toggleThreat()">AI Anomaly Detection: OFF</button>
      <button class="btn" style="background:#ec4899;" id="voiceBtn" onclick="toggleVoice()">Voice SOS (Help): OFF</button>
      <button class="btn" style="background:var(--purple);" id="shakeBtn" onclick="toggleShake()">Shake SOS (6x): OFF</button>
    </div>

    <!-- COL 3: STEALTH -->
    <div class="col">
      <h3 style="color:var(--blue);">🎭 Stealth Controls</h3>
      <button class="btn" style="background:var(--wa);" onclick="enterGhost('wa')">WhatsApp Ghost Chat</button>
      <button class="btn" style="background:#333;" onclick="enterGhost('dead')">Update Ghost Screen</button>
      <button class="btn" style="background:var(--blue);" onclick="toggleQR()">Tracking QR Code</button>
      <div id="qrBox" style="display:none; background:white; padding:5px; margin-top:10px; text-align:center;"><div id="qrCanvas" style="display:inline-block;"></div></div>
    </div>

    <!-- COL 4: ICCC FEED -->
    <div class="col" style="background:#090910;">
      <h3 style="color:var(--orange);">🚨 Authority Tactical Feed</h3>
      <div id="icccFeed"></div>
      <button id="readAllBtn" class="btn" style="background:#222; font-size:10px; margin-top:10px; display:none;" onclick="openHistory()">Read All Logs →</button>
    </div>

    <!-- COL 5: CONTACTS -->
    <div class="col">
      <h3 style="color:var(--red);">👥 Trusted Network</h3>
      <input type="text" id="cn" placeholder="Name">
      <input type="tel" id="cp" placeholder="91XXXXXXXXXX">
      <button class="btn" style="background:var(--red)" onclick="saveContact()">+ Add Member</button>
      <div id="contactList" style="margin-top:10px;"></div>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://xccnzedcdeecfmhxiwxs.supabase.co";
const SUPABASE_KEY = "sb_publishable_Rj_HX1xUGpa-tzhsIPWeqw_6IZx0fEy";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null, mapObj = null, aiActive = false, shakeActive = false;

// --- AUTH ---
async function handleAuthSubmit() {
    const e = document.getElementById("authEmail").value, p = document.getElementById("authPassword").value;
    const { data, error } = await supabaseClient.auth.signInWithPassword({ email: e, password: p });
    if (!error) loginSuccess(data.user);
    else {
        const { error:sErr } = await supabaseClient.auth.signUp({email:e, password:p});
        if(!sErr) alert("Verify email!"); else document.getElementById("authError").textContent = error.message;
    }
}
function loginSuccess(user) { currentUser = user; document.getElementById("authScreen").style.display="none"; document.getElementById("mainDashboard").style.display="grid"; loadContacts(); loadICCC(); }

// --- SOS LOGIC (Animation & Vibrate Updated) ---
let timer;
function startSOSCountdown() {
    let c = 3; const b = document.getElementById("sosBtn");
    const wrap = document.getElementById("sosAnimateWrap");
    
    // START PANIC ANIMATION
    wrap.classList.add("active");
    if(navigator.vibrate) navigator.vibrate([200, 100, 200]);
    
    timer = setInterval(() => {
        b.textContent = c; c--;
        if(c < 0) { 
            clearInterval(timer); b.textContent = "SOS"; 
            wrap.classList.remove("active");
            executeSOS(); 
        }
        else if(navigator.vibrate) navigator.vibrate(100);
    }, 1000);
}

async function executeSOS(silent = false) {
    navigator.geolocation.getCurrentPosition(async (pos) => {
        const { latitude, longitude } = pos.coords;
        await supabaseClient.from("sos_logs").insert([{latitude, longitude, user_id: currentUser.id, status:'verified'}]);
        if(!silent) alert("AUTHORITY NOTIFIED!");
        loadICCC();
    });
}

// --- ALL OTHER LOGIC (Navigation, Ghost, etc.) ---
async function findHelpRoute(type) {
    navigator.geolocation.getCurrentPosition(async (pos) => {
        const uLat = pos.coords.latitude, uLng = pos.coords.longitude;
        document.getElementById("routeMap").style.display = "block";
        if (mapObj) mapObj.remove();
        mapObj = L.map('routeMap').setView([uLat, uLng], 14);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapObj);
        
        const res = await fetch(`https://overpass-api.de/api/interpreter?data=[out:json];node(around:5000,${uLat},${uLng})[amenity~"${type}"];out;`);
        const data = await res.json();
        if (data.elements.length > 0) {
            const dest = data.elements[0];
            L.marker([dest.lat, dest.lon]).addTo(mapObj).bindPopup(dest.tags.name).openPopup();
            L.polyline([[uLat, uLng], [dest.lat, dest.lon]], {color: 'red', weight: 6}).addTo(mapObj);
            L.polyline([[uLat, uLng], [dest.lat+0.002, dest.lon+0.002], [dest.lat, dest.lon]], {color: 'blue', weight: 4, dashArray: '5,10'}).addTo(mapObj);
        }
    });
}

async function loadICCC() {
    const { data } = await supabaseClient.from("sos_logs").select("*").eq("user_id", currentUser.id).order('created_at',{ascending:false});
    const feed = document.getElementById("icccFeed");
    const readAll = document.getElementById("readAllBtn");
    if (data && data.length > 0) {
        feed.innerHTML = `
            <div style="background:#000; padding:12px; border-radius:12px; border-left:4px solid var(--red);">
                <div style="display:flex; justify-content:space-between; font-size:10px; color:#555; margin-bottom:8px;">
                    <span style="color:var(--red); font-weight:bold;">🔴 ACTIVE ALERT</span>
                    <span>${new Date(data[0].created_at).toLocaleTimeString()}</span>
                </div>
                <div style="color:var(--green); font-size:11px; font-weight:bold;">🎤 AUDIO TAP: ACTIVE</div>
                <div class="audio-wave">${Array(6).fill('<div class="audio-bar"></div>').join('')}</div>
                <a href="https://maps.google.com/?q=${data[0].latitude},${data[0].longitude}" target="_blank" style="color:var(--blue); font-size:11px;">ICCC MAP →</a>
            </div>
        `;
        if (data.length > 1) { readAll.style.display="block"; readAll.textContent=`History (${data.length})`; }
    }
}

function openHistory() {
    document.getElementById("historyOverlay").style.display = "flex";
    supabaseClient.from("sos_logs").select("*").eq("user_id", currentUser.id).order('created_at',{ascending:false}).then(({data}) => {
        document.getElementById("historyContent").innerHTML = data.map(l => `
            <div style="background:var(--panel); padding:15px; border-radius:12px; margin-bottom:12px; border:1px solid #333;">
                <span style="color:#666; font-size:11px;">${new Date(l.created_at).toLocaleString()}</span>
                <div style="font-weight:bold; color:var(--orange);">Log ID: #T-${l.id.toString().substr(0,4)}</div>
                <a href="https://maps.google.com/?q=${l.latitude},${l.longitude}" target="_blank" style="color:var(--blue); font-size:12px;">Map View →</a>
            </div>
        `).join("");
    });
}

function closeHistory() { document.getElementById("historyOverlay").style.display = "none"; }
function enterGhost(m) { if(m === 'wa') document.getElementById("whatsappGhost").style.display="flex"; else document.getElementById("blackGhost").style.display="flex"; executeSOS(true); }
function exitGhost() { if(prompt("PIN:") === "1234") { document.querySelectorAll(".full-overlay").forEach(el => el.style.display="none"); } }
function toggleShake() { shakeActive = !shakeActive; document.getElementById("shakeState").textContent = shakeActive ? "ON" : "OFF"; }
async function loadContacts() {
    const { data } = await supabaseClient.from("contacts").select("*").eq("user_id", currentUser.id);
    document.getElementById("contactList").innerHTML = data.map(c => `<div style="background:#000; padding:8px; border-radius:5px; margin-bottom:5px; font-size:12px;">${c.name}</div>`).join("");
}
function saveContact() { alert("Member added!"); }
function handleLogout() { supabaseClient.auth.signOut(); location.reload(); }
function setLanguage(l) { localStorage.setItem("sosLang", l); }

window.onload = () => {
    supabaseClient.auth.getSession().then(({data}) => { if (data.session) loginSuccess(data.session.user); });
};
</script>
</body>
</html>
